<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0d0d0d">
<title>福岡大阪東京 2026</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#0d0d0d;color:#f5f5f5;font-family:system-ui,-apple-system,Segoe UI,Roboto,"Noto Sans TC",sans-serif;overflow:hidden}
body{overscroll-behavior:none}
#app{height:100vh;display:flex;flex-direction:column}
.top{padding:calc(env(safe-area-inset-top) + 14px) 16px 12px;flex:0 0 auto}
.title{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:#f97316;font-weight:700}
.hero{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;margin-top:8px}
.hero h1{font-size:34px;line-height:1.05;margin:0}
.hero .sub{font-size:13px;color:#8a8a8a;margin-top:4px}
.status{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:#34d399;background:rgba(52,211,153,.12);border:1px solid rgba(52,211,153,.18);padding:6px 10px;border-radius:999px}
.content{flex:1;min-height:0;overflow:auto;padding:0 16px 88px;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.content::-webkit-scrollbar{display:none}
.card{background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.08);border-radius:18px;overflow:hidden}
.section{margin:16px 0}
.section h2{font-size:12px;color:#656565;text-transform:uppercase;letter-spacing:.08em;margin:0 0 8px}
.row{display:flex;align-items:center;gap:12px;padding:12px 14px;border-bottom:1px solid rgba(255,255,255,.06)}
.row:last-child{border-bottom:none}
.avatar{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;font-weight:800;color:#000;flex:0 0 auto}
.name{font-weight:700}
.muted{color:#8a8a8a;font-size:12px}
.amt{font-weight:800}
.pill{display:inline-flex;align-items:center;gap:6px;padding:5px 10px;border-radius:999px;background:rgba(249,115,22,.12);border:1px solid rgba(249,115,22,.2);color:#fdba74;font-size:12px}
.bar{height:4px;background:rgba(255,255,255,.08);border-radius:999px;overflow:hidden}
.bar>div{height:100%;border-radius:inherit}
.nav{position:fixed;left:0;right:0;bottom:0;padding:8px 14px calc(env(safe-area-inset-bottom)+10px);background:rgba(13,13,13,.92);backdrop-filter:blur(18px);border-top:1px solid rgba(255,255,255,.07)}
.navin{max-width:560px;margin:0 auto;display:flex;gap:6px;align-items:stretch}
.btn,.navbtn{border:0;border-radius:14px;color:#f5f5f5;background:rgba(255,255,255,.06);min-height:46px;font:inherit}
.navbtn{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;color:#8a8a8a}
.navbtn.on{color:#f97316;background:rgba(249,115,22,.1)}
.fab{width:52px;height:52px;border-radius:50%;margin-top:-18px;background:linear-gradient(135deg,#f97316,#dc2626);box-shadow:0 8px 24px rgba(249,115,22,.35);display:grid;place-items:center;color:#fff;font-size:28px;line-height:0}
.sheetov{position:fixed;inset:0;background:rgba(0,0,0,.7);backdrop-filter:blur(8px);display:none;align-items:flex-end;justify-content:center;z-index:50}
.sheetov.on{display:flex}
.sheet{width:100%;max-width:560px;background:#171717;border:1px solid rgba(255,255,255,.08);border-radius:24px 24px 0 0;max-height:92vh;display:flex;flex-direction:column}
.handle{width:38px;height:4px;border-radius:99px;background:rgba(255,255,255,.16);margin:10px auto 6px}
.sheethead{padding:0 16px 12px;display:flex;justify-content:space-between;align-items:center}
.sheetbody{padding:0 16px 18px;overflow:auto;min-height:0}
.input,.select,.textarea{width:100%;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1);border-radius:12px;padding:12px 14px;color:#f5f5f5;font:inherit;outline:none}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.small{font-size:12px;color:#8a8a8a}
.chiprow{display:flex;gap:8px;overflow:auto;padding-bottom:2px}
.chip{flex:0 0 auto;padding:8px 11px;border-radius:12px;border:1px solid rgba(255,255,255,.1);background:rgba(255,255,255,.05);color:#ddd}
.chip.on{background:#f97316;border-color:#f97316;color:#fff}
.divider{height:1px;background:rgba(255,255,255,.06);margin:10px 0}
.rec{display:flex;align-items:center;justify-content:center;min-height:120px;border:1px dashed rgba(255,255,255,.18);border-radius:16px;background:rgba(255,255,255,.03);color:#8a8a8a;text-align:center;padding:16px}
.k{font-size:13px;color:#8a8a8a;margin:0 0 6px}
.b{width:100%;border:0;border-radius:14px;min-height:48px;font-weight:700;font-size:15px;color:#fff;background:linear-gradient(135deg,#f97316,#dc2626)}
.b2{width:100%;border:1px solid rgba(255,255,255,.1);border-radius:14px;min-height:46px;font-weight:700;background:rgba(255,255,255,.06);color:#f5f5f5}
.topbtns{display:flex;gap:8px;flex-wrap:wrap}
.seg{display:flex;gap:8px}
.seg button{flex:1}
.listTop{display:flex;align-items:center;justify-content:space-between;padding:12px 14px;border-bottom:1px solid rgba(255,255,255,.06)}
.listTop:last-child{border-bottom:0}
.right{text-align:right}
.x{background:none;border:0;color:#f5f5f5;font-size:28px;line-height:1}
.toast{position:fixed;top:calc(env(safe-area-inset-top)+12px);left:50%;transform:translateX(-50%);background:rgba(28,28,28,.96);border:1px solid rgba(255,255,255,.1);padding:10px 14px;border-radius:14px;font-size:14px;z-index:100;display:none;max-width:92vw}
.toast.on{display:block}
.emoji{font-size:34px}
.tag{display:inline-flex;align-items:center;gap:6px;font-size:12px;padding:5px 9px;border-radius:999px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.08)}
.hr{height:1px;background:rgba(255,255,255,.07);margin:12px 0}
.ms{font-size:12px;color:#8a8a8a}
</style>
</head>
<body>
<div id="app"></div>
<div id="toast" class="toast"></div>
<script>
const APP={trip:'fukuoka-osaka-tokyo-2026'};
const CATS=[['food','餐飲','🍜','#f97316'],['transport','交通','🚄','#38bdf8'],['shopping','購物','🛍','#a78bfa'],['stay','住宿','🏨','#fbbf24'],['ticket','門票','🎫','#34d399'],['medicine','藥品','💊','#2dd4bf'],['entertainment','娛樂','🎮','#f472b6'],['other','其他','📦','#a3a3a3']];
const CURS=['JPY','HKD','USD','CNY','KRW','TWD','SGD','EUR'];
const $=s=>document.querySelector(s);
const esc=s=>(s||'').replace(/[&<>\"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;'}[m]));
const store={k:'tt_'+APP.trip,load(){try{return JSON.parse(localStorage.getItem(this.k))||{members:[],expenses:[],snapshots:[],me:''}}catch{return{members:[],expenses:[],snapshots:[],me:''}}},save(d){localStorage.setItem(this.k,JSON.stringify(d))}};
let state=store.load(); let tab='home'; let sheet=''; let editId=null; let rates=null; let rateAt=0;
function toast(t){const e=$('#toast');e.textContent=t;e.classList.add('on');clearTimeout(toast._t);toast._t=setTimeout(()=>e.classList.remove('on'),2200)}
function nowISO(){const d=new Date();const z=n=>String(n).padStart(2,'0');return `${d.getFullYear()}-${z(d.getMonth()+1)}-${z(d.getDate())}T${z(d.getHours())}:${z(d.getMinutes())}`}
function jst(d=new Date()){return new Date(d.getTime()+9*3600e3).toISOString().slice(0,10)}
function fmt(n,c='JPY'){try{return new Intl.NumberFormat('ja-JP',{style:'currency',currency:c,maximumFractionDigits:c==='JPY'?0:1}).format(n)}catch{return c+' '+Math.round(n)}}
function initials(n){return (n||'?').trim().split(/\\s+/).slice(0,2).map(x=>x[0]||'').join('').toUpperCase()||'?'}
function findCat(id){return CATS.find(x=>x[0]===id)||CATS[CATS.length-1]}
async function loadRates(){if(Date.now()-rateAt<3600000&&rates)return rates;const sources=[`https://open.er-api.com/v6/latest/JPY`,`https://cdn.jsdelivr.net/npm/@fawazahmed0/currency-api@latest/v1/currencies/jpy.json`,`https://latest.currency-api.pages.dev/v1/currencies/jpy.json`,`https://frankfurter.dev/latest?base=JPY`];for(const u of sources){try{const r=await fetch(u,{cache:'no-store'});const d=await r.json();if(d?.rates){rates={base:'JPY',rates:d.rates};rateAt=Date.now();return rates}if(d?.jpy){rates={base:'JPY',rates:Object.fromEntries(Object.entries(d.jpy).map(([k,v])=>[k.toUpperCase(),v]))};rateAt=Date.now();return rates}}catch{}}return null}
function toJpy(a,c){a=+a||0;if(!a)return 0;if(!rates||c==='JPY')return a;const v=rates.rates[c];return v?Math.round(a/v):a}
function members(){return state.members||[]}
function expenses(){return state.expenses||[]}
function snapshots(){return state.snapshots||[]}
function me(){return members().find(m=>m.id===state.me)||null}
function activeExpenses(){return expenses().filter(e=>!e.deleted)}
function latestSnap(){const s=snapshots();return s[0]||null}
function expensesAfterSnap(){const s=latestSnap();if(!s)return activeExpenses();return activeExpenses().filter(e=>e.dt>s.id)}
function balances(exps,settledMap={}){const b={};members().forEach(m=>b[m.id]=0);exps.forEach(e=>{if(e.type==='personal')return;const amt=+e.jpy||toJpy(e.amount,e.currency);if(b[e.paidBy]!=null)b[e.paidBy]+=amt;const sw=(e.sharedWith&&e.sharedWith.length)?e.sharedWith:members().map(x=>x.id);const share=sw.length?amt/sw.length:0;sw.forEach(id=>{if(b[id]!=null)b[id]-=share})});Object.entries(settledMap).forEach(([k,v])=>{const[f,t]=k.split('->');if(b[f]!=null)b[f]+=+v;if(b[t]!=null)b[t]-=+v});return b}
function transfersFromBal(b){const pos=[],neg=[];Object.entries(b).forEach(([id,v])=>{if(v>1)pos.push({id,v});else if(v<-1)neg.push({id,v:-v})});pos.sort((a,b)=>b.v-a.v);neg.sort((a,b)=>b.v-a.v);const out=[];let i=0,j=0;while(i<pos.length&&j<neg.length){const p=pos[i],n=neg[j],a=Math.min(p.v,n.v);out.push({from:n.id,to:p.id,amt:a});p.v-=a;n.v-=a;if(p.v<1)i++;if(n.v<1)j++}return out}
function allSettledMap(){const m={};snapshots().forEach(s=>(s.settlements||[]).forEach(t=>{const k=t.from+'->'+t.to;m[k]=(m[k]||0)+(+t.amt||0)}));return m}
function render(){const ex=activeExpenses();const exNew=expensesAfterSnap();const allBal=balances(ex,allSettledMap());const nightBal=balances(exNew);const allTx=transfersFromBal(allBal);const nightTx=transfersFromBal(nightBal);const total=ex.reduce((s,e)=>s+(+e.jpy||toJpy(e.amount,e.currency)),0);const board=members().map(m=>{let t=0;ex.forEach(e=>{const amt=+e.jpy||toJpy(e.amount,e.currency);if(e.type==='personal'&&e.paidBy===m.id)t+=amt;else{const sw=(e.sharedWith&&e.sharedWith.length)?e.sharedWith:members().map(x=>x.id);if(sw.includes(m.id))t+=amt/sw.length}});return {...m,total:t}}).sort((a,b)=>b.total-a.total);const catMap=Object.fromEntries(CATS.map(c=>[c[0],0]));ex.forEach(e=>catMap[e.cat]=(catMap[e.cat]||0)+(+e.jpy||toJpy(e.amount,e.currency)));const cats=CATS.map(c=>({id:c[0],label:c[1],icon:c[2],color:c[3],amt:catMap[c[0]]||0})).filter(x=>x.amt>0).sort((a,b)=>b.amt-a.amt);const catTotal=cats.reduce((s,c)=>s+c.amt,0);
let html=`<div class="top"><div class="title">福岡 · 大阪 · 東京 2026 · 6/11 - 6/25</div><div class="hero"><div><h1>${fmt(total,'JPY')}</h1><div class="sub">${ex.length} 筆消費 · ${members().length} 位旅伴</div></div><div class="status">● 匯率已更新</div></div></div><div class="content">`;
if(tab==='home'){html+=`<div class="section"><h2>今晚結帳</h2><div class="card">${nightTx.length?nightTx.map(t=>rowTx(t,members())).join(''):'<div class="row"><div class="name" style="color:#34d399">✓ 今晚暫時唔使轉帳</div></div>'}</div><div class="ms" style="margin-top:6px">上次結帳後新增嘅消費先會計入呢度</div></div><div class="section"><h2>發達排行榜</h2><div class="card">${board.length?board.map((m,i)=>`<div class="row"><div style="width:24px;color:#666;font-weight:700">#${i+1}</div><div class="avatar" style="background:${m.color||'#f97316'}">${initials(m.name)}</div><div style="flex:1;min-width:0"><div class="name" style="color:${m.color||'#f97316'}">${esc(m.name)}</div><div class="muted">${i===0&&board.length>1?'發咗達 🔥':i===board.length-1&&board.length>1?'識計數 💚':''}</div></div><div class="amt">${fmt(m.total,'JPY')}</div></div>`).join(''):'<div class="row"><div class="muted">未有旅伴</div></div>'}</div></div>${cats.length?`<div class="section"><h2>開支分類</h2><div class="card">${cats.map(c=>`<div class="row"><div style="flex:1"><div style="display:flex;justify-content:space-between;gap:10px"><div>${c.icon} ${c.label}</div><div class="amt">${fmt(c.amt,'JPY')}</div></div><div class="bar" style="margin-top:6px"><div style="width:${catTotal?c.amt/catTotal*100:0}%;background:${c.color}"></div></div></div></div>`).join('')}</div></div>`:''}${rateBox()}</div>`}
if(tab==='expenses'){const groups={};ex.forEach(e=>{const d=e.dt?.slice(0,10)||'未知';(groups[d]||(groups[d]=[])).push(e)});html+=`<div class="section"><h2>消費</h2><div class="topbtns"><button class="b2" onclick="openSheet('addExpense')">＋ 新增消費</button><button class="b2" onclick="openSheet('receipt')">AI 收據</button></div></div><div class="section"><h2>清單</h2>${Object.keys(groups).sort((a,b)=>b.localeCompare(a)).map(d=>`<div style="margin-bottom:12px"><div class="muted" style="margin:0 0 6px 2px">${d}</div><div class="card">${groups[d].map(e=>expRow(e)).join('')}</div></div>`).join('')||'<div class="card"><div class="row"><div class="muted">未有消費紀錄</div></div></div>'}</div>`}
if(tab==='members'){html+=`<div class="section"><h2>旅伴</h2><div class="topbtns"><button class="b2" onclick="openSheet('addMember')">＋ 新增旅伴</button><button class="b2" onclick="openSheet('settings')">設定</button></div></div><div class="section"><div class="card">${members().length?members().map((m,i)=>`<div class="row"><div class="avatar" style="background:${m.color||'#f97316'}">${initials(m.name)}</div><div style="flex:1"><div class="name" style="color:${m.color||'#f97316'}">${esc(m.name)} ${state.me===m.id?'<span class="pill">你</span>':''}</div><div class="muted">${state.me===m.id?'目前身份':'可切換身份'}</div></div><button class="btn" style="padding:0 14px" onclick="switchMe('${m.id}')">切換</button></div>`).join(''):'<div class="row"><div class="muted">未有旅伴，先新增</div></div>'}</div></div>`}
if(tab==='settle'){html+=`<div class="section"><h2>結帳</h2><div class="card">${nightTx.length?nightTx.map(t=>rowTx(t,members())).join(''):'<div class="row"><div class="name" style="color:#34d399">✓ 今晚唔使轉帳</div></div>'}</div><div style="margin-top:10px" class="topbtns"><button class="b" onclick="openSheet('manualSettle')">記錄當場結帳</button></div><div class="ms" style="margin-top:6px">儲存快照後，下次只計新消費</div></div><div class="section"><h2>總欠款</h2><div class="card">${allTx.length?allTx.map(t=>rowTx(t,members(),true)).join(''):'<div class="row"><div class="name" style="color:#34d399">✓ 全部已結清</div></div>'}</div></div><div class="section"><h2>結帳記錄</h2><div class="card">${snapshots().length?snapshots().map(s=>`<div class="listTop" onclick="openSnap('${s.id}')"><div><div class="name">${esc(s.label||'結帳快照')}</div><div class="muted">${(s.settlements||[]).length} 筆轉帳</div></div><div class="muted">›</div></div>`).join(''):'<div class="row"><div class="muted">未有記錄</div></div>'}</div></div>`}
html+=`</div><div class="nav"><div class="navin"><button class="navbtn ${tab==='home'?'on':''}" onclick="setTab('home')">🏠<div>總覽</div></button><button class="navbtn ${tab==='expenses'?'on':''}" onclick="setTab('expenses')">🧾<div>消費</div></button><button class="navbtn" onclick="openSheet('addExpense')"><div class="fab">+</div><div style="margin-top:2px;color:#f97316">新增</div></button><button class="navbtn ${tab==='settle'?'on':''}" onclick="setTab('settle')">💰<div>結帳</div></button><button class="navbtn ${tab==='members'?'on':''}" onclick="setTab('members')">👥<div>旅伴</div></button></div></div>`;
$('#app').innerHTML=html;bindCards();}
function rowTx(t,ms,negative){const f=ms.find(m=>m.id===t.from),to=ms.find(m=>m.id===t.to);return `<div class="row"><div class="avatar" style="background:${f?.color||'#f97316'}">${initials(f?.name)}</div><div style="flex:1"><div class="name"><span style="color:${f?.color||'#f97316'}">${esc(f?.name||'?')}</span> <span class="muted">${negative?'仲欠':'俾'}</span> <span style="color:${to?.color||'#f97316'}">${esc(to?.name||'?')}</span></div><div class="muted">轉帳建議</div></div><div class="amt">${fmt(t.amt,'JPY')}</div></div>`}
function rateBox(){if(!rates)return '<div class="section"><h2>匯率</h2><div class="card"><div class="row"><div class="muted">未能取得匯率，已用本地快取或暫時以原幣顯示</div></div></div></div>';const ks=['HKD','USD','CNY','KRW'];return `<div class="section"><h2>匯率</h2><div class="card">${ks.filter(k=>rates.rates[k]).map(k=>`<div class="row"><div style="flex:1"><div class="name">1 JPY = ${rates.rates[k].toFixed(4)} ${k}</div><div class="muted">自動更新，1 小時 cache</div></div></div>`).join('')}</div></div>`}
function expRow(e){const cat=findCat(e.cat);const payer=members().find(m=>m.id===e.paidBy);return `<div class="listTop" onclick="openExpense('${e.id}')"><div style="display:flex;gap:10px;min-width:0;align-items:center"><div style="width:36px;height:36px;border-radius:10px;background:${cat[3]}22;display:grid;place-items:center;flex:0 0 auto">${cat[2]}</div><div style="min-width:0"><div class="name" style="white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc(e.name)}</div><div class="muted"><span style="color:${payer?.color||'#f97316'}">${esc(payer?.name||'?')}</span>${e.location?' · '+esc(e.location):''}${e.type==='personal'?' · 個人':''}</div></div></div><div class="right"><div class="amt">${fmt(+e.amount||0,e.currency||'JPY')}</div>${e.currency!=='JPY'&&e.jpy?`<div class="muted">¥${(+e.jpy).toLocaleString()}</div>`:''}${e.comments?.length?`<div class="muted">💬${e.comments.length}</div>`:''}</div></div>`}
function setTab(t){tab=t;render()}
function switchMe(id){state.me=id;store.save(state);render();toast('已切換身份')}
function openSheet(t){sheet=t;editId=null;renderSheet()}
function openExpense(id){sheet='viewExpense';editId=id;renderSheet()}
function openSnap(id){sheet='viewSnap';editId=id;renderSheet()}
function save(){store.save(state);render()}
function closeSheet(){sheet='';editId=null;$('.sheetov').classList.remove('on')}
function renderSheet(){if(!sheet)return closeSheet();document.body.querySelector('.sheetov')?.remove();document.body.insertAdjacentHTML('beforeend',`<div class="sheetov on" onclick="if(event.target===this) closeSheet()"><div class="sheet"><div class="handle"></div><div class="sheethead"><div style="font-weight:800;font-size:18px">${sheetTitle()}</div><button class="x" onclick="closeSheet()">×</button></div><div class="sheetbody" id="sheetBody">${sheetBody()}</div></div></div>`);bindSheet()}
function sheetTitle(){return {addExpense:'新增消費',editExpense:'修改消費',viewExpense:'消費詳情',addMember:'新增旅伴',manualSettle:'記錄當場結帳',settings:'設定',receipt:'AI 收據',viewSnap:'結帳記錄'}[sheet]||''}
function sheetBody(){const ex=expenses().find(x=>x.id===editId);const sn=snapshots().find(x=>x.id===editId);if(sheet==='addMember'||sheet==='addExpense'||sheet==='editExpense'||sheet==='manualSettle'||sheet==='receipt')return forms();if(sheet==='viewExpense'&&ex)return viewExpense(ex);if(sheet==='viewSnap'&&sn)return viewSnap(sn);if(sheet==='settings')return settings();return ''}
function forms(){if(sheet==='addMember')return `<div class="k">名稱</div><input id="nm" class="input" placeholder="旅伴名稱"><div class="k" style="margin-top:12px">顏色</div><input id="col" class="input" value="#f97316"><div class="k" style="margin-top:12px">頭像（可留空）</div><textarea id="av" class="textarea" rows="2" placeholder="emoji 或 base64"></textarea><div style="height:12px"></div><button class="b" onclick="saveMember()">新增旅伴</button>`;
if(sheet==='addExpense'||sheet==='editExpense'){const e=sheet==='editExpense'?expenses().find(x=>x.id===editId):null;const sw=e?.sharedWith?.length?e.sharedWith:members().map(x=>x.id);return `<div class="k">消費名稱</div><input id="ename" class="input" value="${esc(e?.name||'')}"><div class="grid2" style="margin-top:12px"><div><div class="k">金額</div><input id="eamt" type="number" class="input" value="${e?.amount||''}"></div><div><div class="k">貨幣</div><select id="ecur" class="select">${CURS.map(c=>`<option ${c===(e?.currency||'JPY')?'selected':''}>${c}</option>`).join('')}</select></div></div><div class="k" style="margin-top:12px">類別</div><div class="chiprow">${CATS.map(c=>`<button class="chip ${c[0]===(e?.cat||'food')?'on':''}" data-cat="${c[0]}">${c[2]} ${c[1]}</button>`).join('')}</div><div class="k" style="margin-top:12px">類型</div><div class="seg"><button class="chip ${(e?.type||'shared')==='shared'?'on':''}" data-type="shared">共同分帳</button><button class="chip ${(e?.type||'shared')==='personal'?'on':''}" data-type="personal">個人消費</button></div><div class="k" style="margin-top:12px">付款人</div><select id="epay" class="select">${members().map(m=>`<option value="${m.id}" ${(e?.paidBy||m.id)==m.id?'selected':''}>${esc(m.name)}</option>`).join('')}</select><div class="k" style="margin-top:12px">分擔人</div><div class="card">${members().map(m=>`<label class="row" style="cursor:pointer"><div class="avatar" style="width:30px;height:30px;background:${m.color||'#f97316'}">${initials(m.name)}</div><div style="flex:1;color:${m.color||'#f97316'}">${esc(m.name)}</div><input type="checkbox" data-share="${m.id}" ${sw.includes(m.id)?'checked':''}></label>`).join('')}</div><div class="k" style="margin-top:12px">分帳方式</div><div class="seg"><button class="chip ${(e?.splitMode||'equal')==='equal'?'on':''}" data-split="equal">平均分</button><button class="chip ${(e?.splitMode||'equal')==='manual'?'on':''}" data-split="manual">手動輸入</button></div><div id="manualArea" style="margin-top:12px;display:${(e?.splitMode||'equal')==='manual'?'block':'none'}"><div class="card">${members().filter(m=>sw.includes(m.id)).map(m=>`<div class="row"><div style="width:64px;color:${m.color||'#f97316'}">${esc(m.name)}</div><input class="input split" data-mid="${m.id}" type="number" placeholder="0" value="${e?.splits?.[m.id]||''}"></div>`).join('')}</div></div><div class="k" style="margin-top:12px">地點</div><input id="eloc" class="input" value="${esc(e?.location||'')}"><div class="k" style="margin-top:12px">日期時間</div><input id="edt" class="input" type="datetime-local" value="${e?.dt?.slice(0,16)||nowISO()}"><div class="k" style="margin-top:12px">備註</div><textarea id="enote" class="textarea" rows="3">${esc(e?.note||'')}</textarea><div style="height:12px"></div><button class="b" onclick="saveExpense()">${sheet==='editExpense'?'儲存修改':'新增消費'}</button>`}
if(sheet==='manualSettle'){const tx=transfersFromBal(balances(expensesAfterSnap()));return `<div class="k">標題</div><input id="slabel" class="input" placeholder="今晚結帳"><div class="k" style="margin-top:12px">手動確認轉帳</div><div class="card">${tx.map(t=>{const f=members().find(m=>m.id===t.from),to=members().find(m=>m.id===t.to);return `<div class="row"><div style="flex:1"><div class="name"><span style="color:${f?.color||'#f97316'}">${esc(f?.name||'?')}</span> 俾 <span style="color:${to?.color||'#f97316'}">${esc(to?.name||'?')}</span></div><div class="muted">可改金額再儲存</div></div><input class="input stx" data-k="${t.from}->${t.to}" type="number" value="${Math.round(t.amt)}" style="width:96px;text-align:right"></div>`}).join('')||'<div class="row"><div class="muted">今次暫時唔使轉帳</div></div>'}</div><div style="height:12px"></div><button class="b" onclick="saveSnapshot()">儲存結帳快照</button><div class="ms" style="margin-top:8px">儲存後，下次結帳只計新消費</div>`}
if(sheet==='receipt'){return `<div class="rec"><div><div class="emoji">🧾</div><div style="margin-top:8px;font-weight:700">AI 收據掃描</div><div class="ms" style="margin-top:6px">此功能預留 Gemini / OpenAI Vision API 位置<br>你可以貼相片後自動辨識日文品項</div></div></div><div style="height:12px"></div><button class="b2" onclick="toast('未接 API');">上傳收據</button><div class="hr"></div><div class="ms">之後可以把識到嘅品項手動分配俾某個人嘅付款賬單入面</div>`}
return ''}
function viewExpense(e){const c=findCat(e.cat);const p=members().find(m=>m.id===e.paidBy);const sw=(e.sharedWith&&e.sharedWith.length?e.sharedWith:members().map(x=>x.id)).map(id=>members().find(m=>m.id===id)).filter(Boolean);return `<div class="card"><div class="row" style="align-items:flex-start"><div style="width:48px;height:48px;border-radius:14px;background:${c[3]}22;display:grid;place-items:center;font-size:26px">${c[2]}</div><div style="flex:1"><div style="font-size:20px;font-weight:800">${esc(e.name)}</div><div class="muted">${e.dt?.replace('T',' ')}${e.location?' · '+esc(e.location):''}</div></div><div class="right"><div class="amt">${fmt(+e.amount||0,e.currency||'JPY')}</div>${e.currency!=='JPY'&&e.jpy?`<div class="muted">¥${(+e.jpy).toLocaleString()}</div>`:''}</div></div><div class="listTop"><div class="muted">類別</div><div><span class="tag">${c[2]} ${c[1]}</span></div></div><div class="listTop"><div class="muted">類型</div><div>${e.type==='personal'?'個人消費（唔計入欠款）':'共同分帳'}</div></div><div class="listTop"><div class="muted">付款人</div><div style="color:${p?.color||'#f97316'};font-weight:700">${esc(p?.name||'?')}</div></div><div class="listTop"><div class="muted">分擔人</div><div style="display:flex;gap:4px;flex-wrap:wrap;justify-content:flex-end">${sw.map(m=>`<span class="tag" style="color:${m.color||'#f97316'}">${esc(m.name)}</span>`).join('')}</div></div>${e.note?`<div class="divider"></div><div class="row"><div><div class="muted">備註</div><div style="white-space:pre-wrap">${esc(e.note)}</div></div></div>`:''}</div><div style="height:12px"></div><div class="grid2"><button class="b2" onclick="startEditExpense('${e.id}')">修改</button><button class="b2" onclick="delExpense('${e.id}')">刪除</button></div>`}
function viewSnap(s){return `<div class="card"><div class="row"><div style="flex:1"><div style="font-size:18px;font-weight:800">${esc(s.label||'結帳快照')}</div><div class="muted">${(s.settlements||[]).length} 筆轉帳 · ${s.id.slice(0,10)}</div></div></div>${(s.settlements||[]).map(t=>{const f=members().find(m=>m.id===t.from),to=members().find(m=>m.id===t.to);return `<div class="row"><div class="avatar" style="background:${f?.color||'#f97316'}">${initials(f?.name)}</div><div style="flex:1"><div class="name"><span style="color:${f?.color||'#f97316'}">${esc(f?.name||'?')}</span> 已俾 <span style="color:${to?.color||'#f97316'}">${esc(to?.name||'?')}</span></div><div class="muted">當場結帳記錄</div></div><div class="amt">${fmt(t.amt,'JPY')}</div></div>`}).join('')||'<div class="row"><div class="muted">無轉帳記錄</div></div>'}</div>`}
function settings(){return `<div class="card"><div class="row"><div style="flex:1"><div class="name">分享連結</div><div class="muted">直接俾朋友打開</div></div><button class="b2" style="width:auto;padding:0 14px" onclick="copyLink()">複製</button></div><div class="row"><div style="flex:1"><div class="name">旅程日期</div><div class="muted">6月11日 - 25日</div></div></div><div class="row"><div style="flex:1"><div class="name">提示</div><div class="muted">呢個版本用 localStorage，未接 Firebase</div></div></div></div>`}
function bindCards(){document.querySelectorAll('[data-cat]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-cat]').forEach(x=>x.classList.remove('on'));b.classList.add('on')});document.querySelectorAll('[data-type]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-type]').forEach(x=>x.classList.remove('on'));b.classList.add('on')});document.querySelectorAll('[data-split]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-split]').forEach(x=>x.classList.remove('on'));b.classList.add('on');$('#manualArea').style.display=b.dataset.split==='manual'?'block':'none'});}
function bindSheet(){bindCards();document.querySelectorAll('[data-share]').forEach(i=>i.onchange=()=>{const arr=[...document.querySelectorAll('[data-share]')].filter(x=>x.checked).map(x=>x.dataset.share);$('#manualArea').innerHTML=`<div class="card">${members().filter(m=>arr.includes(m.id)).map(m=>`<div class="row"><div style="width:64px;color:${m.color||'#f97316'}">${esc(m.name)}</div><input class="input split" data-mid="${m.id}" type="number" placeholder="0"></div>`).join('')}</div>`})}
function saveMember(){const nm=$('#nm').value.trim();if(!nm)return toast('請填名稱');state.members.push({id:Math.random().toString(36).slice(2,9),name:nm,color:$('#col').value||'#f97316',avatar:$('#av').value||''});if(!state.me)state.me=state.members[0].id;store.save(state);toast('已新增');closeSheet();render()}
function saveExpense(){const e={id:editId||Math.random().toString(36).slice(2,9),name:$('#ename').value.trim(),amount:+$('#eamt').value||0,currency:$('#ecur').value,cat:(document.querySelector('[data-cat].on')?.dataset.cat)||'food',type:(document.querySelector('[data-type].on')?.dataset.type)||'shared',paidBy:$('#epay').value,sharedWith:[...document.querySelectorAll('[data-share]')].filter(x=>x.checked).map(x=>x.dataset.share),splitMode:(document.querySelector('[data-split].on')?.dataset.split)||'equal',splits:Object.fromEntries([...document.querySelectorAll('.split')].map(i=>[i.dataset.mid,+i.value||0])),location:$('#eloc').value.trim(),note:$('#enote').value.trim(),dt:new Date($('#edt').value).toISOString(),deleted:false,comments:[]};if(!e.name)return toast('請填名稱');if(!e.amount)return toast('請填有效金額');if(e.splitMode==='manual'){const sum=Object.values(e.splits).reduce((a,b)=>a+(+b||0),0);if(Math.abs(sum-e.amount)>1)return toast('手動分帳總和唔啱')}e.jpy=toJpy(e.amount,e.currency);if(editId){const i=state.expenses.findIndex(x=>x.id===editId);state.expenses[i]=e;editId=null}else state.expenses.unshift(e);store.save(state);toast('已儲存');closeSheet();render()}
function startEditExpense(id){editId=id;sheet='editExpense';renderSheet()}
function delExpense(id){const e=state.expenses.find(x=>x.id===id);if(!e)return; e.deleted=true;store.save(state);toast('已移去回收箱');closeSheet();render()}
function saveSnapshot(){const tx=transfersFromBal(balances(expensesAfterSnap()));const settlements=tx.map(t=>({from:t.from,to:t.to,amt:+(($('.stx[data-k=\"'+t.from+'->'+t.to+'\"]')?.value)||t.amt)})).filter(x=>x.amt>0);state.snapshots.unshift({id:new Date().toISOString(),label:($('#slabel')?.value||'今晚結帳').trim(),settlements});store.save(state);toast('已記錄結帳');closeSheet();render()}
async function copyLink(){const u=location.origin+location.pathname;await navigator.clipboard.writeText(u);toast('已複製連結')}
document.body.insertAdjacentHTML('beforeend','<div class="sheetov" onclick="if(event.target===this) closeSheet()"><div class="sheet"><div class="handle"></div><div class="sheethead"><div id="sheetTitle" style="font-weight:800;font-size:18px"></div><button class="x" onclick="closeSheet()">×</button></div><div class="sheetbody" id="sheetBody"></div></div></div>');
window.setTab=setTab;window.openSheet=openSheet;window.openExpense=openExpense;window.openSnap=openSnap;window.closeSheet=closeSheet;window.switchMe=switchMe;window.saveMember=saveMember;window.saveExpense=saveExpense;window.startEditExpense=startEditExpense;window.delExpense=delExpense;window.saveSnapshot=saveSnapshot;window.copyLink=copyLink;window.toast=toast;window.renderSheet=renderSheet;window.render=render;
loadRates().then(()=>render());setInterval(()=>loadRates().then(()=>render()),3600000);
</script>
</body>
</html>
