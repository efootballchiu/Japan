
<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0d0d0d">
<title>旅行分帳</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#0d0d0d;color:#f5f5f5;font-family:system-ui,-apple-system,Segoe UI,Roboto,"Noto Sans TC",sans-serif;overflow:hidden}
body{overscroll-behavior:none}
#app{height:100vh;display:flex;flex-direction:column}
.top{padding:calc(env(safe-area-inset-top) + 14px) 16px 12px;flex:0 0 auto}
.title{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:#f97316;font-weight:700}
.hero{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;margin-top:8px}
.hero h1{font-size:34px;line-height:1.05;margin:0}
.hero .sub{font-size:13px;color:#8a8a8a;margin-top:4px}
.status{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:#34d399;background:rgba(52,211,153,.12);border:1px solid rgba(52,211,153,.18);padding:6px 10px;border-radius:999px}
.content{flex:1;min-height:0;overflow:auto;padding:0 16px 110px;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.content::-webkit-scrollbar{display:none}
.card{background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.08);border-radius:18px;overflow:hidden}
.section{margin:16px 0}
.section h2{font-size:12px;color:#656565;text-transform:uppercase;letter-spacing:.08em;margin:0 0 8px}
.row{display:flex;align-items:center;gap:12px;padding:12px 14px;border-bottom:1px solid rgba(255,255,255,.06)}
.row:last-child{border-bottom:none}
.avatar{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;font-weight:800;color:#000;flex:0 0 auto;overflow:hidden}
.avatar img{width:100%;height:100%;object-fit:cover}
.name{font-weight:700}
.muted{color:#8a8a8a;font-size:12px}
.amt{font-weight:800}
.pill{display:inline-flex;align-items:center;gap:6px;padding:5px 10px;border-radius:999px;background:rgba(249,115,22,.12);border:1px solid rgba(249,115,22,.2);color:#fdba74;font-size:12px}
.bar{height:4px;background:rgba(255,255,255,.08);border-radius:999px;overflow:hidden}
.bar>div{height:100%;border-radius:inherit}
.nav{position:fixed;left:0;right:0;bottom:0;padding:8px 14px calc(env(safe-area-inset-bottom)+10px);background:rgba(13,13,13,.92);backdrop-filter:blur(18px);border-top:1px solid rgba(255,255,255,.03)}
.navin{max-width:560px;margin:0 auto;display:flex;gap:8px;align-items:stretch}
.navbtn{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;color:#8a8a8a;background:transparent;border-radius:12px;padding:8px 6px;border:0}
.navbtn.on{color:#f97316;background:transparent}
.fab{width:64px;height:64px;border-radius:50%;margin-top:-26px;background:linear-gradient(135deg,#f97316,#dc2626);box-shadow:0 12px 34px rgba(249,115,22,.36);display:grid;place-items:center;color:#fff;font-size:28px;line-height:0;border:6px solid rgba(13,13,13,0.92)}
.sheetov{position:fixed;inset:0;background:rgba(0,0,0,.7);backdrop-filter:blur(8px);display:none;align-items:flex-end;justify-content:center;z-index:50}
.sheetov.on{display:flex}
.sheet{width:100%;max-width:560px;background:#171717;border:1px solid rgba(255,255,255,.08);border-radius:24px 24px 0 0;max-height:92vh;display:flex;flex-direction:column}
.handle{width:38px;height:4px;border-radius:99px;background:rgba(255,255,255,.16);margin:10px auto 6px}
.sheethead{padding:0 16px 12px;display:flex;justify-content:space-between;align-items:center}
.sheetbody{padding:0 16px 18px;overflow:auto;min-height:0}
.input,.select,.textarea{width:100%;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1);border-radius:12px;padding:12px 14px;color:#f5f5f5;font:inherit;outline:none}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.small{font-size:12px;color:#8a8a8a}
.chiprow{display:flex;gap:8px;overflow:auto;padding-bottom:2px}
.chip{flex:0 0 auto;padding:8px 11px;border-radius:12px;border:1px solid rgba(255,255,255,.06);background:rgba(255,255,255,.03);color:#ddd}
.chip.on{background:#f97316;border-color:#f97316;color:#fff}
.divider{height:1px;background:rgba(255,255,255,.06);margin:10px 0}
.rec{display:flex;align-items:center;justify-content:center;min-height:120px;border:1px dashed rgba(255,255,255,.18);border-radius:16px;background:rgba(255,255,255,.03);color:#8a8a8a;text-align:center;padding:16px}
.k{font-size:13px;color:#8a8a8a;margin:0 0 6px}
.b{width:100%;border:0;border-radius:14px;min-height:48px;font-weight:700;font-size:15px;color:#fff;background:linear-gradient(135deg,#f97316,#dc2626)}
.b2{width:100%;border:1px solid rgba(255,255,255,.06);border-radius:14px;min-height:46px;font-weight:700;background:rgba(255,255,255,.03);color:#f5f5f5}
.topbtns{display:flex;gap:8px;flex-wrap:wrap}
.seg{display:flex;gap:8px}
.seg button{flex:1}
.listTop{display:flex;align-items:center;justify-content:space-between;padding:12px 14px;border-bottom:1px solid rgba(255,255,255,.06)}
.listTop:last-child{border-bottom:0}
.right{text-align:right}
.x{background:none;border:0;color:#f5f5f5;font-size:28px;line-height:1}
.toast{position:fixed;top:calc(env(safe-area-inset-top)+12px);left:50%;transform:translateX(-50%);background:rgba(28,28,28,.96);border:1px solid rgba(255,255,255,.1);padding:10px 14px;border-radius:14px;font-size:14px;z-index:100;display:none;max-width:92vw}
.toast.on{display:block}
.emoji{font-size:34px}
.tag{display:inline-flex;align-items:center;gap:6px;font-size:12px;padding:5px 9px;border-radius:999px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.08)}
.hr{height:1px;background:rgba(255,255,255,.07);margin:12px 0}
.ms{font-size:12px;color:#8a8a8a}
.colorRow{display:flex;gap:8px;align-items:center}
.colorSwatch{width:36px;height:36px;border-radius:8px;border:1px solid rgba(255,255,255,.06);cursor:pointer;flex:0 0 auto;display:grid;place-items:center}
.colorInput{width:56px;padding:6px;border-radius:8px;border:1px solid rgba(255,255,255,.06);background:rgba(255,255,255,.03);color:#f5f5f5}
.paymentItem{display:flex;gap:8px;align-items:center}
.paymentItem input{flex:1}
@media (max-width:420px){.fab{width:56px;height:56px;margin-top:-22px;border-width:5px}}
</style>
</head>
<body>
<div id="app"></div>
<div id="toast" class="toast"></div>
<script>
const APP={tripId:'travel-expense'};
const CATS=[['food','餐飲','🍜','#f97316'],['transport','交通','🚄','#38bdf8'],['shopping','購物','🛍','#a78bfa'],['stay','住宿','🏨','#fbbf24'],['ticket','門票','🎫','#34d399'],['medicine','藥品','💊','#2dd4bf'],['entertainment','娛樂','🎮','#f472b6'],['other','其他','📦','#a3a3a3']];
const CURS=['JPY','HKD','USD','CNY','KRW','TWD','SGD','EUR'];
const $=s=>document.querySelector(s);
const esc=s=>(s||'').replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));
const key='tt_'+APP.tripId;

function loadState(){
  try{
    let s = JSON.parse(localStorage.getItem(key));
    return s ? {members:[], expenses:[], snapshots:[], transfers:[], me:'', ...s} : {members:[], expenses:[], snapshots:[], transfers:[], me:''};
  }catch{
    return {members:[], expenses:[], snapshots:[], transfers:[], me:''};
  }
}
function saveState(s){localStorage.setItem(key,JSON.stringify(s))}
let state=loadState(),tab='home',sheet='',editId=null,rates=null,rateTs=0;

function toast(t){const e=$('#toast');e.textContent=t;e.classList.add('on');clearTimeout(toast._t);toast._t=setTimeout(()=>e.classList.remove('on'),2200)}
function nowISO(){const d=new Date(),z=n=>String(n).padStart(2,'0');return `${d.getFullYear()}-${z(d.getMonth()+1)}-${z(d.getDate())}T${z(d.getHours())}:${z(d.getMinutes())}`}
function initials(n){return(n||'?').trim().split(/\s+/).slice(0,2).map(x=>x[0]||'').join('').toUpperCase()||'?'}
function findCat(id){return CATS.find(c=>c[0]===id)||CATS[CATS.length-1]}

function checkLock(dtStr) {
  const today = new Date();
  const isTodayLocked = today.getMonth() === 5 && today.getDate() >= 11 && today.getDate() <= 25;
  let isRecordLocked = false;
  if (dtStr) {
    const rDate = new Date(dtStr);
    if (!isNaN(rDate.getTime())) {
      isRecordLocked = rDate.getMonth() === 5 && rDate.getDate() >= 11 && rDate.getDate() <= 25;
    }
  }
  return isTodayLocked || isRecordLocked;
}

async function loadRates(){
  if(Date.now()-rateTs<3600000&&rates)return rates;
  const sources=[`https://open.er-api.com/v6/latest/JPY`,`https://cdn.jsdelivr.net/npm/@fawazahmed0/currency-api@latest/v1/currencies/jpy.json`,`https://latest.currency-api.pages.dev/v1/currencies/jpy.json`,`https://frankfurter.dev/latest?base=JPY`];
  for(const u of sources){try{const r=await fetch(u,{cache:'no-store'});const j=await r.json();if(j?.rates){rates={base:'JPY',rates:j.rates};rateTs=Date.now();return rates}if(j?.jpy){rates={base:'JPY',rates:Object.fromEntries(Object.entries(j.jpy).map(([k,v])=>[k.toUpperCase(),v]))};rateTs=Date.now();return rates}}catch{}}
  return null;
}
function toJpy(a,c){a=+a||0;if(!a)return 0;if(!rates||c==='JPY')return Math.round(a);const v=rates.rates[c];return v?Math.round(a/v):Math.round(a)}
function members(){return state.members||[]}
function expenses(){return state.expenses||[]}
function snapshots(){return state.snapshots||[]}
function transfers(){return state.transfers||[]}
function activeExpenses(){return expenses().filter(e=>!e.deleted)}

function calcBalances(){
  const bal=Object.fromEntries(members().map(m=>[m.id,0]));
  
  activeExpenses().forEach(e=>{
    if(e.type==='personal')return;
    const amt=(+e.jpy||toJpy(e.amount,e.currency)) || 0;
    if(bal[e.paidBy]!=null)bal[e.paidBy]+=amt;
    const sw=(e.sharedWith&&e.sharedWith.length)?e.sharedWith:members().map(m=>m.id);
    
    if (e.splitMode === 'manual' && e.splits) {
       let splitTotal = 0;
       Object.values(e.splits).forEach(v => splitTotal += (+v||0));
       const fxRate = (e.amount > 0 && splitTotal > 0) ? (amt / splitTotal) : 1; 
       Object.entries(e.splits).forEach(([id, val]) => {
          if (bal[id] != null) bal[id] -= ((+val || 0) * fxRate);
       });
    } else {
       const share=sw.length?amt/sw.length:0;
       sw.forEach(id=>{if(bal[id]!=null)bal[id]-=share});
    }
  });

  const settledMap={};
  snapshots().forEach(s=>(s.rows||[]).forEach(r=>{
    const k=r.from+'->'+r.to;
    settledMap[k]=(settledMap[k]||0)+(+r.total||0);
  }));
  Object.entries(settledMap).forEach(([k,v])=>{
    const[f,t]=k.split('->');
    if(bal[f]!=null)bal[f]+=(+v||0);
    if(bal[t]!=null)bal[t]-=(+v||0);
  });

  transfers().forEach(t => {
     const tAmt = (+t.jpy || 0);
     if(bal[t.from]!=null) bal[t.from] += tAmt;
     if(bal[t.to]!=null) bal[t.to] -= tAmt;
  });

  return bal;
}

function transfersFromBalance(b){
  const pos=[],neg=[];
  Object.entries(b).forEach(([id,v])=>{if(v>1)pos.push({id,v});else if(v<-1)neg.push({id,v:Math.abs(v)})});
  pos.sort((a,b)=>b.v-a.v);neg.sort((a,b)=>b.v-a.v);
  const out=[];let i=0,j=0;
  while(i<pos.length&&j<neg.length){
    const p=pos[i],n=neg[j],a=Math.min(p.v,n.v);
    if(a>0)out.push({from:n.id,to:p.id,amt:Math.round(a)});
    p.v-=a;n.v-=a;
    if(p.v<1)i++;if(n.v<1)j++
  }
  return out;
}

function moneyText(jpy){
  const val = (+jpy || 0);
  const hk=(!rates||!rates.rates.HKD)?'':` (HK$${Math.round(val*rates.rates.HKD)})`;
  return `¥${Math.round(val)}${hk}`;
}

function transferRow(t, showPayBtn=false){
  const f=members().find(m=>m.id===t.from)||{name:'?',color:'#f97316'};
  const to=members().find(m=>m.id===t.to)||{name:'?',color:'#f97316'};
  const fAvatar = f.avatar && typeof f.avatar==='string' && f.avatar.startsWith('data:image') ? `<img src="${f.avatar}">` : initials(f.name);
  const toAvatar = to.avatar && typeof to.avatar==='string' && to.avatar.startsWith('data:image') ? `<img src="${to.avatar}">` : initials(to.name);
  
  return `
  <div class="card" style="margin-bottom:12px; padding:18px 16px; border:1px solid rgba(249,115,22,0.25); background:linear-gradient(to bottom right, rgba(255,255,255,0.03), rgba(249,115,22,0.06)); box-shadow:0 4px 20px rgba(0,0,0,0.2);">
    <div style="display:flex; justify-content:space-between; align-items:center;">
       <div style="display:flex; align-items:center; gap:12px;">
          <div style="text-align:center;">
             <div class="avatar" style="width:44px; height:44px; margin:0 auto; border:2px solid ${f.color||'#f97316'}; box-shadow:0 0 10px rgba(0,0,0,0.5);">${fAvatar}</div>
             <div class="name" style="margin-top:6px; color:${f.color||'#f97316'}; font-size:13px;">${esc(f.name)}</div>
          </div>
          <div style="color:#ef4444; font-size:22px; font-weight:900; margin-bottom:20px;">➔</div>
          <div style="text-align:center;">
             <div class="avatar" style="width:44px; height:44px; margin:0 auto; border:2px solid ${to.color||'#f97316'}; box-shadow:0 0 10px rgba(0,0,0,0.5);">${toAvatar}</div>
             <div class="name" style="margin-top:6px; color:${to.color||'#f97316'}; font-size:13px;">${esc(to.name)}</div>
          </div>
       </div>
       <div class="right" style="display:flex; flex-direction:column; align-items:flex-end;">
          <div class="muted" style="margin-bottom:4px;">爭 (要畀)</div>
          <div class="amt" style="font-size:22px; color:#ef4444; font-weight:900; line-height:1.1; white-space:nowrap;">${moneyText(t.amt)}</div>
          ${showPayBtn?`<button class="b" style="width:auto; padding:6px 16px; min-height:0; border-radius:10px; font-size:14px; margin-top:12px; background:linear-gradient(135deg,#f97316,#dc2626); box-shadow:0 4px 12px rgba(239,68,68,0.4);" onclick="openTransfer('${t.from}','${t.to}',${t.amt})">💸 立即還款</button>`:''}
       </div>
    </div>
  </div>`;
}

function render(){
  const ex=activeExpenses(), allBal=calcBalances(), allTx=transfersFromBalance(allBal), total=ex.reduce((s,e)=>s+((+e.jpy)||toJpy(e.amount,e.currency)),0);
  
  const board=members().map(m=>{ return {...m, total: (allBal[m.id]||0)}; }).sort((a,b)=>b.total-a.total);
  
  const catMap=Object.fromEntries(CATS.map(c=>[c[0],0]));
  ex.forEach(e=>catMap[e.cat]=(catMap[e.cat]||0)+((+e.jpy)||toJpy(e.amount,e.currency)));
  const cats=CATS.map(c=>({id:c[0],label:c[1],icon:c[2],color:c[3],amt:catMap[c[0]]||0})).filter(x=>x.amt>0).sort((a,b)=>b.amt-a.amt),catTotal=cats.reduce((s,c)=>s+c.amt,0);
  
  let html=`<div class="top"><div class="title">旅行分帳 · 6/11 - 6/25</div><div class="hero"><div><h1>${moneyText(total)}</h1><div class="sub">${ex.length} 筆消費 · ${members().length} 位旅伴</div></div><div class="status">● 匯率已更新</div></div></div><div class="content">`;
  
  if(tab==='home'){
    html+=`<div class="section"><h2>目前總欠款</h2>${allTx.length?allTx.map(t=>transferRow(t, false)).join(''):'<div class="card"><div class="row"><div class="name" style="color:#34d399">✓ 全部已結清，無人爭人錢！</div></div></div>'}<div class="ms" style="margin-top:8px; text-align:center;">撳下面 💰 結帳 可以分次還錢</div></div>`;
    html+=`<div class="section"><h2>財務狀況榜 (結清進度)</h2><div class="card">${board.length?board.map((m,i)=>{
      let statusTxt = m.total > 1 ? '大債主 🔥' : m.total < -1 ? '爭人錢 💸' : '已結清 💚';
      let color = m.total > 1 ? '#34d399' : m.total < -1 ? '#ef4444' : '#8a8a8a';
      let sign = m.total > 1 ? '+' : '';
      const mAvatar = m.avatar && typeof m.avatar==='string' && m.avatar.startsWith('data:image') ? `<img src="${m.avatar}">` : initials(m.name);
      return `<div class="row"><div style="width:24px;color:#666;font-weight:700">#${i+1}</div><div class="avatar">${mAvatar}</div><div style="flex:1;min-width:0"><div class="name" style="color:${m.color||'#f97316'}">${esc(m.name)}</div><div class="muted">${statusTxt}</div></div><div class="amt" style="color:${color}">${sign}${moneyText(m.total)}</div></div>`;
    }).join(''):'<div class="row"><div class="muted">未有旅伴</div></div>'}</div></div>`;
    if(cats.length){
      html+=`<div class="section"><h2>開支分類</h2><div class="card">${cats.map(c=>`<div class="row"><div style="flex:1"><div style="display:flex;justify-content:space-between;gap:10px"><div>${c.icon} ${c.label}</div><div class="amt">${moneyText(c.amt)}</div></div><div class="bar" style="margin-top:6px"><div style="width:${catTotal?c.amt/catTotal*100:0}%;background:${c.color}"></div></div></div></div>`).join('')}</div></div>`;
    }
    html+=rateBox()+`</div>`;
  }
  
  if(tab==='expenses'){
    const groups={};ex.forEach(e=>{const d=e.dt?.slice(0,10)||'未知';(groups[d]||(groups[d]=[])).push(e)});
    html+=`<div class="section"><h2>消費</h2><div class="topbtns"><button class="b2" onclick="openSheet('addExpense')">＋ 新增消費</button><button class="b2" onclick="openSheet('receipt')">AI 收據</button></div></div><div class="section"><h2>清單</h2>${Object.keys(groups).sort((a,b)=>b.localeCompare(a)).map(d=>`<div style="margin-bottom:12px"><div class="muted" style="margin:0 0 6px 2px">${d}</div><div class="card">${groups[d].map(e=>expenseRow(e)).join('')}</div></div>`).join('')||'<div class="card"><div class="row"><div class="muted">未有消費紀錄</div></div></div>'}</div>`;
  }
  
  if(tab==='members'){
    html+=`<div class="section"><h2>旅伴</h2><div class="topbtns"><button class="b2" onclick="openSheet('addMember')">＋ 新增旅伴</button><button class="b2" onclick="openSheet('settings')">設定</button></div></div><div class="section"><div class="card">${members().length?members().map(m=>{
       const mAvatar = m.avatar && typeof m.avatar==='string' && m.avatar.startsWith('data:image') ? `<img src="${m.avatar}">` : initials(m.name);
       return `<div class="row"><div class="avatar">${mAvatar}</div><div style="flex:1"><div class="name" style="color:${m.color||'#f97316'}">${esc(m.name)} ${state.me===m.id?'<span class="pill">你</span>':''}</div><div class="muted">${state.me===m.id?'目前身份':'可切換身份'}</div></div><div style="display:flex;gap:6px"><button class="b2" style="padding:0 12px" onclick="switchMe('${m.id}')">切換</button><button class="b2" style="padding:0 12px;color:#ef4444;border-color:rgba(239,68,68,0.3)" onclick="delMember('${m.id}')">刪除</button></div></div>`;
    }).join(''):'<div class="row"><div class="muted">未有旅伴，先新增</div></div>'}</div></div>`;
  }
  
  if(tab==='settle'){
    html+=`<div class="section"><h2>目前總欠款 (剩餘要還)</h2>${allTx.length?allTx.map(t=>transferRow(t, true)).join(''):'<div class="card"><div class="row"><div class="name" style="color:#34d399">✓ 全部已結清，無人爭人錢！</div></div></div>'}<div style="margin-top:16px" class="topbtns"><button class="b2" style="background:rgba(255,255,255,.05);" onclick="openSheet('addTransfer')">＋ 新增其他還款</button></div></div>`;
    
    html+=`<div class="section"><h2>還款紀錄</h2><div class="card">`;
    if(transfers().length) {
       html += transfers().map(t => {
         const f = members().find(m=>m.id===t.from)||{name:'?'};
         const to = members().find(m=>m.id===t.to)||{name:'?'};
         const dtDisplay = t.dt ? String(t.dt).replace('T', ' ').slice(0, 16) : '未知時間';
         return `<div class="listTop">
           <div style="display:flex;gap:10px;align-items:center">
             <div style="width:36px;height:36px;border-radius:10px;background:rgba(52,211,153,.15);display:grid;place-items:center;font-size:18px">💸</div>
             <div>

async function compressImage(file, maxWidth = 800) {
  return new Promise((resolve) => {
    const img = new Image();
    img.onload = () => {
      const canvas = document.createElement('canvas');
      let w = img.width, h = img.height;
      if (w > maxWidth) {
        h = Math.round((maxWidth / w) * h);
        w = maxWidth;
      }
      canvas.width = w;
      canvas.height = h;
      const ctx = canvas.getContext('2d');
      ctx.drawImage(img, 0, 0, w, h);
      resolve(canvas.toDataURL('image/jpeg', 0.7)); 
    };
    img.src = URL.createObjectURL(file); 
  });
}

function saveExpense(){
  const id=editId||Math.random().toString(36).slice(2,9),name=$('#ename').value.trim();if(!name)return toast('請填名稱');
  const amount=+$('#eamt').value||0;if(!amount)return toast('請填有效金額');
  const currency=$('#ecur').value,cat=document.querySelector('[data-cat].on')?.dataset.cat||'food',type=document.querySelector('[data-type].on')?.dataset.type||'shared',paidBy=$('#epay').value,sharedWith=[...document.querySelectorAll('[data-share]')].filter(x=>x.checked).map(x=>x.dataset.share),splitMode=document.querySelector('[data-split].on')?.dataset.split||'equal',splits=Object.fromEntries([...document.querySelectorAll('.split')].map(i=>[i.dataset.mid,+i.value||0]));
  if(splitMode==='manual'){const s=Object.values(splits).reduce((a,b)=>a+(+b||0),0);if(Math.abs(s-amount)>1)return toast('手動分帳總和唔啱')}
  
  const obj={id,name,amount,currency,cat,type,paidBy,sharedWith,splitMode,splits,location:$('#eloc').value.trim(),note:$('#enote').value.trim(),jpy:toJpy(amount,currency),deleted:false,comments:[], editHistory:[]};
  
  if(editId){
    const i=state.expenses.findIndex(x=>x.id===editId);
    const oldE = state.expenses[i];
    obj.dt = oldE.dt; 
    obj.editHistory = oldE.editHistory || [];
    obj.editHistory.push({
       ts: new Date().toISOString(),
       by: state.me,
       action: `修改咗紀錄 (舊金額: ${oldE.amount} ${oldE.currency})`
    });
    state.expenses[i]=obj;
    editId=null;
  } else {
    obj.dt = new Date($('#edt').value).toISOString();
    state.expenses.unshift(obj);
  }
  
  saveState(state);toast('已儲存');closeSheet();safeRender();
}

   if(!to) return toast('請選擇收款人');
   if(from === to) return toast('自己唔可以還畀自己啦！');
   
   const cur = $('#tCur').value;
   const note = $('#tNote').value.trim();
   
   const t = {
      id: 't_' + Date.now() + Math.random().toString(36).slice(2,7),
      from,
      to,
      amount: amt,
      currency: cur,
      jpy: toJpy(amt, cur),
      dt: nowISO(),
      note
   };
   state.transfers = state.transfers || [];
   state.transfers.unshift(t);
   saveState(state);
   toast('已成功記錄還款！');
   closeSheet();
   safeRender();
}

function deleteTransfer(id) {
   const t = state.transfers.find(x=>x.id===id);
   if(t && checkLock(t.dt)) return toast('⚠️ 系統鎖定：6月11日至25日行程期間，嚴禁刪除還款紀錄！');
   if(!confirm('確定要刪除呢筆還款紀錄？')) return;
   state.transfers = state.transfers.filter(x => x.id !== id);
   saveState(state);
   toast('已刪除還款紀錄');
   safeRender();
}

function resetAllData() {
  const pwd = prompt('⚠️ 警告：這將會清除所有旅伴、消費和還款紀錄！\\n請輸入 Admin 密碼以確認清除：');
  if(pwd !== 'chiu') {
    if(pwd !== null) toast('密碼錯誤，取消重設！');
    return;
  }
  if(!confirm('⚠️ 最後確認：真係要洗牌重新嚟過？此動作無法復原！')) return;
  
  localStorage.removeItem(key);
  state = {members:[], expenses:[], snapshots:[], transfers:[], me:''};
  toast('已成功清除所有資料！');
  closeSheet();
  safeRender();
}

async function uploadReceipt(){
  if(!window.__receiptData)return toast('請先揀相片');
  console.log("壓縮後嘅 Base64 長度:", window.__receiptData.length);
  toast('相片已載入，準備接 API');

function bindGlobal(){
  window.setTab=setTab; window.openSheet=openSheet; window.openExpense=openExpense; window.closeSheet=closeSheet;
  window.switchMe=switchMe; window.saveMember=saveMember; window.delMember=delMember; window.confirmDelMember=confirmDelMember;
