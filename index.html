<script type="text/babel">
const{useState,useEffect,useRef,useMemo,useCallback}=React;
const TRIP='fukuoka-osaka-tokyo-2026';
const CATS=[
  {id:'food',label:'餐飲',icon:'🍜',color:'#f97316'},
  {id:'transport',label:'交通',icon:'🚄',color:'#38bdf8'},
  {id:'shopping',label:'購物',icon:'🛍',color:'#a78bfa'},
  {id:'stay',label:'住宿',icon:'🏨',color:'#fbbf24'},
  {id:'ticket',label:'門票',icon:'🎫',color:'#34d399'},
  {id:'medicine',label:'藥品',icon:'💊',color:'#2dd4bf'},
  {id:'entertainment',label:'娛樂',icon:'🎮',color:'#f472b6'},
  {id:'other',label:'其他',icon:'📦',color:'#a3a3a3'},
];
const COLORS=['#f97316','#ef4444','#f472b6','#a78bfa','#3b82f6','#06b6d4','#10b981','#f59e0b'];
const CURS=['JPY','HKD','USD','CNY','KRW','TWD','SGD','EUR'];

// ── utils ──
const slug=()=>Math.random().toString(36).slice(2,8);
const initials=n=>(n||'').trim().split(/\s+/).slice(0,2).map(w=>w[0]?.toUpperCase()||'').join('')||'?';
const clamp=(n,a,b)=>Math.min(b,Math.max(a,n));
const hexRgb=h=>{const c=h.replace('#',''),f=c.length===3?c.split('').map(x=>x+x).join(''):c,n=parseInt(f,16);return{r:(n>>16)&255,g:(n>>8)&255,b:n&255}};
const lum=({r,g,b})=>{const t=v=>{const c=v/255;return c<=0.03928?c/12.92:((c+0.055)/1.055)**2.4};return 0.2126*t(r)+0.7152*t(g)+0.0722*t(b)};
const contrast=(h1,h2)=>{const[l1,l2]=[lum(hexRgb(h1)),lum(hexRgb(h2))];return(Math.max(l1,l2)+0.05)/(Math.min(l1,l2)+0.05)};
const readable=hex=>{if(!hex)return'#f97316';let c=hex,i=0;while(contrast(c,'#0d0d0d')<4.5&&i<20){const{r,g,b}=hexRgb(c);const m=v=>clamp(Math.round(v+14),0,255);c='#'+[m(r),m(g),m(b)].map(v=>v.toString(16).padStart(2,'0')).join('');i++}return c};
const fmtM=(n,cur='JPY')=>{try{return new Intl.NumberFormat('ja-JP',{style:'currency',currency:cur,maximumFractionDigits:cur==='JPY'?0:1}).format(n)}catch{return cur+' '+Math.round(n)}};
const fmtDate=iso=>{if(!iso)return'';try{return new Date(iso).toLocaleDateString('zh-HK',{month:'short',day:'numeric'})}catch{return''}};
const fmtTime=iso=>{if(!iso)return'';try{return new Date(iso).toLocaleTimeString('zh-HK',{hour:'2-digit',minute:'2-digit'})}catch{return''}};
const nowLocal=()=>new Date(Date.now()-new Date().getTimezoneOffset()*60000).toISOString().slice(0,16);
const todayStr=()=>new Date().toISOString().slice(0,10);

// ── Rates: 4 fallback sources, cache 1h in localStorage ──
async function fetchRates(base='JPY'){
  const KEY=`rates_${base}`;
  try{
    const cached=JSON.parse(localStorage.getItem(KEY)||'null');
    if(cached&&Date.now()-cached.ts<3600000)return cached;
  }catch{}
  const b=base.toUpperCase(),bl=b.toLowerCase();
  const sources=[
    ()=>fetch(`https://open.er-api.com/v6/latest/${b}`,{cache:'no-store'}).then(r=>r.json()).then(d=>{if(d?.rates)return{base:b,rates:d.rates};throw 0}),
    ()=>fetch(`https://cdn.jsdelivr.net/npm/@fawazahmed0/currency-api@latest/v1/currencies/${bl}.json`,{cache:'no-store'}).then(r=>r.json()).then(d=>{if(d?.[bl])return{base:b,rates:Object.fromEntries(Object.entries(d[bl]).map(([k,v])=>[k.toUpperCase(),v]))};throw 0}),
    ()=>fetch(`https://latest.currency-api.pages.dev/v1/currencies/${bl}.json`,{cache:'no-store'}).then(r=>r.json()).then(d=>{if(d?.[bl])return{base:b,rates:Object.fromEntries(Object.entries(d[bl]).map(([k,v])=>[k.toUpperCase(),v]))};throw 0}),
    ()=>fetch(`https://frankfurter.dev/latest?base=${b}`,{cache:'no-store'}).then(r=>r.json()).then(d=>{if(d?.rates)return{base:b,rates:{...d.rates,[b]:1}};throw 0}),
  ];
  for(const src of sources){
    try{
      const data=await src();
      const result={...data,ts:Date.now()};
      localStorage.setItem(KEY,JSON.stringify(result));
      return result;
    }catch{}
  }
  return null;
}

function toJpy(amount,currency,rates){
  if(!amount)return 0;
  const amt=Number(amount);
  if(!rates||currency==='JPY'||currency===rates.base)return amt;
  const toBase=rates.rates[currency];
  if(!toBase)return amt;
  if(rates.base==='JPY')return amt/toBase;
  const baseToJpy=1/(rates.rates['JPY']||1);
  return amt/toBase*baseToJpy;
}

// ── Firebase hook ──
function useFB(){
  const[ready,setReady]=useState(!!window.__db);
  useEffect(()=>{if(window.__db)return;const h=()=>setReady(true);window.addEventListener('fb-ready',h);return()=>window.removeEventListener('fb-ready',h)},[]);
  return ready?{db:window.__db,...window.__fb}:null;
}

// ══════════════════════════════════════════
//  APP
// ══════════════════════════════════════════
function App(){
  const fb=useFB();
  const[tab,setTab]=useState('home');
  const[members,setMembers]=useState([]);
  const[expenses,setExpenses]=useState([]);
  const[snapshots,setSnapshots]=useState([]); // daily settlement snapshots
  const[myId,setMyId]=useState(()=>localStorage.getItem('tt_me')||'');
  const[sheet,setSheet]=useState(null);
  const[toast,setToast]=useState({m:'',k:0});
  const[rates,setRates]=useState(null);
  const[rateStatus,setRateStatus]=useState('idle'); // idle|loading|ok|fail

  const showToast=m=>setToast(t=>({m,k:t.key+1}));

  // Firebase listeners
  useEffect(()=>{
    if(!fb)return;
    const{db,collection,onSnapshot}=fb;
    const u=[];
    u.push(onSnapshot(collection(db,'trips',TRIP,'members'),s=>{
      setMembers(s.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>(a.createdAt?.seconds||0)-(b.createdAt?.seconds||0)));
    }));
    u.push(onSnapshot(collection(db,'trips',TRIP,'expenses'),s=>{
      setExpenses(s.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>(b.dt||'').localeCompare(a.dt||'')));
    }));
    u.push(onSnapshot(collection(db,'trips',TRIP,'snapshots'),s=>{
      setSnapshots(s.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>b.id.localeCompare(a.id)));
    }));
    return()=>u.forEach(f=>f());
  },[fb]);

  // Fetch rates on load + every hour
  useEffect(()=>{
    async function load(){
      setRateStatus('loading');
      const r=await fetchRates('JPY');
      if(r){setRates(r);setRateStatus('ok')}
      else setRateStatus('fail');
    }
    load();
    const t=setInterval(load,3600000);
    return()=>clearInterval(t);
  },[]);

  const me=useMemo(()=>members.find(m=>m.id===myId)||null,[members,myId]);
  const activeExp=useMemo(()=>expenses.filter(e=>!e.deleted),[expenses]);
  const deletedExp=useMemo(()=>expenses.filter(e=>e.deleted),[expenses]);

  // Latest snapshot date (if any)
  const latestSnap=snapshots[0]||null;

  // Expenses AFTER latest snapshot (for tonight's balance)
  const expAfterSnap=useMemo(()=>{
    if(!latestSnap)return activeExp;
    return activeExp.filter(e=>e.dt>latestSnap.id);
  },[activeExp,latestSnap]);

  // ALL-TIME balance (includes manual settlements)
  function calcBalances(expList,memberList,settledMap={}){
    const bal=Object.fromEntries(memberList.map(m=>[m.id,0]));
    expList.forEach(e=>{
      if(e.type==='personal')return;
      const amt=Number(e.jpy||toJpy(e.amount,e.currency,rates)||0);
      if(bal[e.paidBy]!==undefined)bal[e.paidBy]+=amt;
      const sw=e.sharedWith?.length?e.sharedWith:memberList.map(m=>m.id);
      const share=sw.length?amt/sw.length:0;
      sw.forEach(id=>{if(bal[id]!==undefined)bal[id]-=share});
    });
    // Apply manual settlements: from→to amount reduces from's debt, increases to's
    Object.entries(settledMap).forEach(([key,amt])=>{
      const[fromId,toId]=key.split('->');
      if(bal[fromId]!==undefined)bal[fromId]+=Number(amt);
      if(bal[toId]!==undefined)bal[toId]-=Number(amt);
    });
    return bal;
  }

  // Transfers from balance map
  function calcTransfers(bal,memberList){
    const pos=[],neg=[];
    Object.entries(bal).forEach(([id,v])=>{if(v>1)pos.push({id,v});else if(v<-1)neg.push({id,v:Math.abs(v)})});
    pos.sort((a,b)=>b.v-a.v);neg.sort((a,b)=>b.v-a.v);
    const txns=[];let pi=0,ni=0;
    while(pi<pos.length&&ni<neg.length){
      const p=pos[pi],n=neg[ni],amt=Math.min(p.v,n.v);
      if(amt>1)txns.push({from:n.id,to:p.id,amt});
      p.v-=amt;n.v-=amt;
      if(p.v<1)pi++;if(n.v<1)ni++;
    }
    return txns;
  }

  // Tonight's balance (since last snapshot)
  const tonightBal=useMemo(()=>calcBalances(expAfterSnap,members),[expAfterSnap,members,rates]);
  const tonightTransfers=useMemo(()=>calcTransfers({...tonightBal},members),[tonightBal]);

  // Overall balance (all time, minus snapshots' settled amounts)
  const allSettled=useMemo(()=>{
    const map={};
    snapshots.forEach(s=>{
      (s.settlements||[]).forEach(t=>{
        const k=`${t.from}->${t.to}`;
        map[k]=(map[k]||0)+Number(t.amt||0);
      });
    });
    return map;
  },[snapshots]);
  const overallBal=useMemo(()=>calcBalances(activeExp,members,allSettled),[activeExp,members,allSettled,rates]);
  const overallTransfers=useMemo(()=>calcTransfers({...overallBal},members),[overallBal]);

  // Leaderboard
  const board=useMemo(()=>{
    return members.map(m=>{
      let total=0;
      activeExp.forEach(e=>{
        const amt=Number(e.jpy||toJpy(e.amount,e.currency,rates)||0);
        if(e.type==='personal'&&e.paidBy===m.id){total+=amt;return}
        const sw=e.sharedWith?.length?e.sharedWith:members.map(x=>x.id);
        if(sw.includes(m.id))total+=amt/sw.length;
      });
      return{...m,total};
    }).sort((a,b)=>b.total-a.total);
  },[activeExp,members,rates]);

  const catTotals=useMemo(()=>{
    const map={};CATS.forEach(c=>{map[c.id]=0});
    activeExp.forEach(e=>{if(map[e.cat]!==undefined)map[e.cat]+=Number(e.jpy||toJpy(e.amount,e.currency,rates)||0)});
    const total=Object.values(map).reduce((s,v)=>s+v,0);
    return CATS.map(c=>({...c,total:map[c.id]||0,pct:total?map[c.id]/total*100:0})).filter(c=>c.total>0).sort((a,b)=>b.total-a.total);
  },[activeExp,rates]);

  const totalJpy=useMemo(()=>activeExp.reduce((s,e)=>s+Number(e.jpy||toJpy(e.amount,e.currency,rates)||0),0),[activeExp,rates]);

  // ── Actions ──
  async function addMember(data){
    if(!fb||!data.name?.trim()){showToast('請填名稱');return false}
    const{db,collection,addDoc,serverTimestamp}=fb;
    try{
      const ref=await addDoc(collection(db,'trips',TRIP,'members'),{name:data.name.trim(),color:readable(data.color||COLORS[0]),avatar:data.avatar||'',createdAt:serverTimestamp()});
      if(!myId){localStorage.setItem('tt_me',ref.id);setMyId(ref.id)}
      showToast('已新增 '+data.name.trim());return true;
    }catch(e){showToast('失敗：'+e.message);return false}
  }

  async function saveExpense(data){
    if(!fb||!data.name?.trim()){showToast('請填名稱');return false}
    const amt=Number(data.amount);
    if(!amt||amt<=0){showToast('請填有效金額');return false}
    if(data.splitMode==='manual'){
      const sw=data.sharedWith||members.map(m=>m.id);
      const st=sw.reduce((s,id)=>s+Number(data.splits?.[id]||0),0);
      if(Math.abs(st-amt)>1){showToast(`手動分帳總和 ${Math.round(st)} ≠ ${Math.round(amt)}`);return false}
    }
    const jpyAmt=Math.round(toJpy(amt,data.currency||'JPY',rates));
    const{db,collection,addDoc,serverTimestamp}=fb;
    try{
      await addDoc(collection(db,'trips',TRIP,'expenses'),{
        name:data.name.trim(),amount:amt,jpy:jpyAmt,currency:data.currency||'JPY',
        cat:data.cat||'other',type:data.type||'shared',
        paidBy:data.paidBy||myId||members[0]?.id||'',
        sharedWith:data.sharedWith?.length?data.sharedWith:members.map(m=>m.id),
        splitMode:data.splitMode||'equal',splits:data.splits||{},
        location:data.location||'',note:data.note||'',
        dt:data.dt?new Date(data.dt).toISOString():new Date().toISOString(),
        deleted:false,comments:[],
        createdBy:myId||'',createdAt:serverTimestamp(),updatedAt:serverTimestamp(),
      });
      showToast('已新增消費');return true;
    }catch(e){showToast('失敗：'+e.message);return false}
  }

  async function editExpense(id,data){
    if(!fb)return false;
    const amt=Number(data.amount);
    if(data.splitMode==='manual'){
      const sw=data.sharedWith||members.map(m=>m.id);
      const st=sw.reduce((s,id)=>s+Number(data.splits?.[id]||0),0);
      if(Math.abs(st-amt)>1){showToast(`手動分帳總和 ${Math.round(st)} ≠ ${Math.round(amt)}`);return false}
    }
    const jpyAmt=Math.round(toJpy(amt,data.currency||'JPY',rates));
    const{db,doc,updateDoc,serverTimestamp}=fb;
    try{
      await updateDoc(doc(db,'trips',TRIP,'expenses',id),{...data,amount:amt,jpy:jpyAmt,updatedAt:serverTimestamp()});
      showToast('已更新');return true;
    }catch(e){showToast('失敗：'+e.message);return false}
  }

  async function softDelete(id,del){
    if(!fb)return;
    const{db,doc,updateDoc,serverTimestamp}=fb;
    await updateDoc(doc(db,'trips',TRIP,'expenses',id),{deleted:del,updatedAt:serverTimestamp()});
    showToast(del?'已移至回收箱':'已還原');
  }

  async function permDelete(id){
    if(!fb)return;
    const{db,doc,deleteDoc}=fb;
    await deleteDoc(doc(db,'trips',TRIP,'expenses',id));
    showToast('已永久刪除');
  }

  async function addComment(expId,text){
    if(!fb||!text?.trim()||!me)return;
    const exp=expenses.find(e=>e.id===expId);if(!exp)return;
    const c={id:slug(),text:text.trim(),authorId:me.id,authorName:me.name,authorColor:me.color||COLORS[0],at:new Date().toISOString()};
    const{db,doc,updateDoc,serverTimestamp}=fb;
    await updateDoc(doc(db,'trips',TRIP,'expenses',expId),{comments:[...(exp.comments||[]),c],updatedAt:serverTimestamp()});
  }

  // ── Manual Settlement (結帳) ──
  // Creates a snapshot recording: date, settlements made, balances at time
  async function createSnapshot(label,settlements){
    if(!fb)return false;
    const{db,collection,addDoc,serverTimestamp}=fb;
    const id=new Date().toISOString(); // use ISO as unique id & sort key
    try{
      await addDoc(collection(db,'trips',TRIP,'snapshots'),{
        id,label:label||fmtDate(id)+' 結帳',
        settlements, // [{from,to,amt}]
        balanceAfter:tonightBal,
        createdBy:myId||'',createdAt:serverTimestamp(),
      });
      showToast('結帳快照已儲存');return true;
    }catch(e){showToast('失敗：'+e.message);return false}
  }

  const selectMe=id=>{localStorage.setItem('tt_me',id);setMyId(id);showToast('已選擇身分');setSheet(null)};

  if(!fb)return(
    <div style={{display:'flex',alignItems:'center',justifyContent:'center',minHeight:'100dvh',flexDirection:'column',gap:16}}>
      <div style={{fontSize:40}}>✈️</div>

      {tab==='expenses'&&<ExpensesPage expenses={activeExp} deletedExp={deletedExp} members={members} me={me} rates={rates} setSheet={setSheet} softDelete={softDelete} permDelete={permDelete}/>}
      {tab==='members'&&<MembersPage members={members} me={me} myId={myId} selectMe={selectMe} setSheet={setSheet}/>}
      {tab==='settle'&&<SettlePage snapshots={snapshots} members={members} tonightTransfers={tonightTransfers} overallTransfers={overallTransfers} latestSnap={latestSnap} expAfterSnap={expAfterSnap} setSheet={setSheet} createSnapshot={createSnapshot} me={me}/>}

      {/* Bottom Nav */}
      <nav className="bnav">
        <div className="ni">
          <NavBtn label="總覽" active={tab==='home'} onClick={()=>setTab('home')}>

          </NavBtn>
          <NavBtn label="消費" active={tab==='expenses'} onClick={()=>setTab('expenses')}>
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><rect x="2" y="5" width="20" height="14" rx="2"/><line x1="2" y1="10" x2="22" y2="10"/></svg>
          </NavBtn>
          {/* FAB */}
          <button className="nb" onClick={()=>setSheet({type:'addExpense'})}>
            <div style={{width:50,height:50,background:'linear-gradient(135deg,#f97316,#dc2626)',borderRadius:'50%',display:'flex',alignItems:'center',justifyContent:'center',boxShadow:'0 4px 16px rgba(249,115,22,0.4)',marginTop:-18}}>
              <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="white" strokeWidth="2.5" strokeLinecap="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>

          </NavBtn>
          <NavBtn label="旅伴" active={tab==='members'} onClick={()=>setTab('members')}>
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M17 21v-2a4 4 0 00-4-4H5a4 4 0 00-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 00-3-3.87"/><path d="M16 3.13a4 4 0 010 7.75"/></svg>
          </NavBtn>
        </div>
      </nav>

      {/* Sheets */}
      {sheet?.type==='addExpense'&&<ExpenseSheet mode="add" members={members} me={me} rates={rates} onSave={async d=>{if(await saveExpense(d))setSheet(null)}} onClose={()=>setSheet(null)}/>}
      {sheet?.type==='editExpense'&&<ExpenseSheet mode="edit" expense={sheet.data} members={members} me={me} rates={rates} onSave={async d=>{if(await editExpense(sheet.data.id,d))setSheet(null)}} onClose={()=>setSheet(null)}/>}
      {sheet?.type==='viewExpense'&&<ViewSheet expense={sheet.data} members={members} me={me} softDelete={softDelete} addComment={addComment} setSheet={setSheet} onClose={()=>setSheet(null)}/>}
      {sheet?.type==='addMember'&&<AddMemberSheet usedColors={members.map(m=>m.color)} onSave={async d=>{if(await addMember(d))setSheet(null)}} onClose={()=>setSheet(null)}/>}

      {sheet?.type==='viewSnap'&&<ViewSnapSheet snap={sheet.data} members={members} onClose={()=>setSheet(null)}/>}
    </div>
  );
}

// ── NavBtn ──
function NavBtn({label,active,onClick,children}){
  return(
    <button className={`nb${active?' on':''}`} onClick={onClick}>
      {children}
      <span className="nl">{label}</span>
    </button>
  );
}

// ── Toast ──
function ToastBanner({toast}){
  const[vis,setVis]=useState(false);
  useEffect(()=>{if(!toast.m)return;setVis(true);const t=setTimeout(()=>setVis(false),2600);return()=>clearTimeout(t)},[toast.k]);
  if(!vis||!toast.m)return null;
  return(
    <div style={{position:'fixed',top:'var(--st)',left:0,right:0,zIndex:200,display:'flex',justifyContent:'center',padding:'0 16px',pointerEvents:'none'}}>
      <div style={{background:'rgba(28,28,28,0.97)',border:'1.5px solid rgba(255,255,255,0.12)',borderRadius:14,padding:'10px 18px',fontSize:14,color:'#f5f5f5',backdropFilter:'blur(12px)',boxShadow:'0 8px 32px rgba(0,0,0,0.4)',animation:'fi .2s ease-out'}}>
        {toast.m}
      </div>
    </div>
  );
}

// ── Avatar ──
function Avatar({member,size=40}){
  const bg=readable(member?.color||COLORS[0]);
  const content=member?.avatar||'';
  const isImg=/^image\//.test(content);
  return(
    <div style={{width:size,height:size,borderRadius:'50%',background:bg,display:'flex',alignItems:'center',justifyContent:'center',overflow:'hidden',flexShrink:0,fontSize:size*0.38,fontWeight:700,color:'#000',boxShadow:'0 2px 8px rgba(0,0,0,0.3)'}}>
      {isImg?<img src={content} alt="" style={{width:'100%',height:'100%',objectFit:'cover'}}/>:(content||initials(member?.name))}
    </div>
  );
}

// ── ColorPicker ──
function ColorPicker({value,onChange,usedColors=[]}){
  const used=new Set(usedColors.map(c=>(c||'').toUpperCase()));
  return(
    <div style={{display:'flex',flexWrap:'wrap',gap:8,alignItems:'center'}}>
      {COLORS.map(c=>{
        const rc=readable(c);const active=value?.toUpperCase()===c.toUpperCase();
        return(
          <button key={c} type="button" onClick={()=>onChange(c)} style={{width:40,height:40,borderRadius:'50%',background:rc,border:active?'3px solid #fff':'3px solid transparent',position:'relative',cursor:'pointer',boxShadow:active?'0 0 0 2px rgba(255,255,255,0.3)':'none'}}>
            {used.has(c.toUpperCase())&&<span style={{position:'absolute',top:-2,right:-2,width:13,height:13,borderRadius:'50%',background:'#1a1a1a',border:'1px solid rgba(255,255,255,0.2)',fontSize:8,display:'flex',alignItems:'center',justifyContent:'center',color:'#aaa'}}>✓</span>}
          </button>
        );
      })}
      <input type="color" value={value||'#f97316'} onChange={e=>onChange(e.target.value)} style={{width:40,height:40,padding:3,borderRadius:'50%',border:'2px solid rgba(255,255,255,0.1)',background:'none'}}/>
    </div>
  );
}

// ── Field ──
function Field({label,hint,children}){
  return(
    <div>
      <div style={{fontSize:13,fontWeight:500,color:'#a3a3a3',marginBottom:6}}>{label}</div>
      {children}
      {hint&&<div style={{fontSize:12,color:'#525252',marginTop:4}}>{hint}</div>}
    </div>
  );
}

// ── Sheet Shell ──
function Sheet({title,onClose,children}){
  return(
    <div className="sheet-ov" onClick={e=>{if(e.target===e.currentTarget)onClose()}}>
      <div className="sheet">
        <div className="sh"/>
        <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',padding:'4px 20px 16px',flexShrink:0}}>
          <div style={{fontWeight:700,fontSize:18}}>{title}</div>
          <button className="btn-s" style={{width:'auto',padding:'4px 12px',fontSize:22,lineHeight:1}} onClick={onClose}>×</button>
        </div>
        <div className="sb">{children}</div>
      </div>
    </div>
  );
}

  const top=board[0],bot=board[board.length-1];
  return(
    <div style={{paddingTop:8,paddingBottom:8,display:'flex',flexDirection:'column',gap:20}}>

        <div style={{fontSize:38,fontWeight:700,letterSpacing:'-0.02em'}}>{fmtM(totalJpy,'JPY')}</div>

      <div>

        <div className="card2">
          {tonightTransfers.length===0?(
            <div style={{padding:'14px 16px',fontSize:14,color:'#34d399'}}>✓ 今晚暫時唔使轉帳</div>
          ):tonightTransfers.map((t,i)=>{
            const from=members.find(m=>m.id===t.from);
            const to=members.find(m=>m.id===t.to);
            return(
              <div key={i} style={{display:'flex',alignItems:'center',gap:10,padding:'12px 16px',borderBottom:i<tonightTransfers.length-1?'1px solid rgba(255,255,255,0.06)':'none'}}>
                <Avatar member={from} size={30}/>
                <div style={{flex:1,fontSize:14}}>
                  <span style={{color:readable(from?.color||COLORS[0]),fontWeight:500}}>{from?.name}</span>
                  <span style={{color:'#525252'}}> 俾 </span>
                  <span style={{color:readable(to?.color||COLORS[0]),fontWeight:500}}>{to?.name}</span>
                </div>
                <div style={{fontWeight:700,color:'#f97316',fontSize:15}}>{fmtM(t.amt,'JPY')}</div>

        {latestSnap&&(

      {/* Leaderboard */}
      <div>

          {board.length===0&&<div style={{padding:16,color:'#525252',fontSize:14}}>未有資料</div>}
          {board.map((m,i)=>(
            <div key={m.id} style={{display:'flex',alignItems:'center',gap:12,padding:'12px 16px',borderBottom:i<board.length-1?'1px solid rgba(255,255,255,0.06)':'none'}}>
              <div style={{width:22,fontSize:13,color:'#525252',fontWeight:600}}>#{i+1}</div>
              <Avatar member={m} size={36}/>
              <div style={{flex:1,minWidth:0}}>
                <div style={{fontWeight:600,fontSize:15,color:readable(m.color||COLORS[0]),overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{m.name}</div>
                {i===0&&board.length>1&&<div style={{fontSize:11,color:'#f97316'}}>發咗達 🔥</div>}
                {i===board.length-1&&board.length>1&&<div style={{fontSize:11,color:'#34d399'}}>識計數 💚</div>}

                <div style={{display:'flex',justifyContent:'space-between',fontSize:13,marginBottom:4}}>
                  <span style={{color:'#d4d4d4'}}>{c.icon} {c.label}</span>
                  <span style={{fontWeight:600}}>{fmtM(c.total,'JPY')}</span>

// ════════ EXPENSES PAGE ════════
function ExpensesPage({expenses,deletedExp,members,me,rates,setSheet,softDelete,permDelete}){
  const[search,setSearch]=useState('');
  const[filterCat,setFilterCat]=useState('all');
  const[showDel,setShowDel]=useState(false);

  const filtered=useMemo(()=>expenses.filter(e=>{
    if(filterCat!=='all'&&e.cat!==filterCat)return false;
    const q=search.toLowerCase();
    if(q&&!e.name?.toLowerCase().includes(q)&&!e.location?.toLowerCase().includes(q))return false;
    return true;
  }),[expenses,filterCat,search]);

  const grouped=useMemo(()=>{
    const map=new Map();
    filtered.forEach(e=>{
      const d=fmtDate(e.dt)||'未知日期';
      if(!map.has(d))map.set(d,[]);
      map.get(d).push(e);
    });
    return[...map.entries()];
  },[filtered]);

  return(
    <div style={{paddingTop:8,display:'flex',flexDirection:'column',gap:12}}>
      <input value={search} onChange={e=>setSearch(e.target.value)} placeholder="🔍  搜尋名稱、地點⋯" style={{fontSize:14}}/>
      <div style={{display:'flex',gap:8,overflowX:'auto',paddingBottom:4,WebkitOverflowScrolling:'touch'}}>
        {[{id:'all',label:'全部',icon:'',color:''},...CATS].map(c=>{
          const active=filterCat===c.id;
          return(
            <button key={c.id} type="button" onClick={()=>setFilterCat(c.id)} style={{flexShrink:0,background:active?'#f97316':'rgba(255,255,255,0.06)',border:`1.5px solid ${active?'#f97316':'rgba(255,255,255,0.1)'}`,borderRadius:10,padding:'7px 12px',fontSize:13,color:active?'#fff':'#d4d4d4',cursor:'pointer',minHeight:36,whiteSpace:'nowrap',fontFamily:'inherit'}}>
              {c.icon?c.icon+' ':''}{c.label}
            </button>
          );
        })}
      </div>

      {grouped.length===0&&<div style={{color:'#525252',fontSize:14,paddingTop:20,textAlign:'center'}}>未有符合條件嘅消費</div>}
      {grouped.map(([date,exps])=>(
        <div key={date}>
          <div style={{fontSize:11,fontWeight:600,color:'#525252',textTransform:'uppercase',letterSpacing:'0.06em',marginBottom:6,paddingLeft:2}}>{date}</div>
          <div className="card2">
            {exps.map((e,i)=>{
              const payer=members.find(m=>m.id===e.paidBy);
              const cat=CATS.find(c=>c.id===e.cat)||CATS[CATS.length-1];
              return(
                <button key={e.id} type="button" onClick={()=>setSheet({type:'viewExpense',e})} style={{display:'flex',alignItems:'center',gap:12,width:'100%',padding:'13px 16px',background:'transparent',border:'none',cursor:'pointer',borderBottom:i<exps.length-1?'1px solid rgba(255,255,255,0.06)':'none',textAlign:'left',minHeight:44}}>
                  <div style={{width:38,height:38,borderRadius:10,background:cat.color+'22',display:'flex',alignItems:'center',justifyContent:'center',fontSize:18,flexShrink:0}}>{cat.icon}</div>
                  <div style={{flex:1,minWidth:0}}>
                    <div style={{fontWeight:500,fontSize:15,color:'#f5f5f5',overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{e.name}</div>
                    <div style={{fontSize:12,color:'#737373',marginTop:2}}>
                      <span style={{color:readable(payer?.color||COLORS[0])}}>{payer?.name||'?'}</span>
                      {e.location?' · '+e.location:''}
                      {e.type==='personal'?<span style={{color:'#a78bfa'}}> 個人</span>:''}
                    </div>
                  </div>
                  <div style={{textAlign:'right',flexShrink:0}}>
                    <div style={{fontWeight:700,fontSize:15}}>{fmtM(Number(e.amount||0),e.currency||'JPY')}</div>
                    {e.currency!=='JPY'&&e.jpy&&<div style={{fontSize:11,color:'#525252'}}>¥{Number(e.jpy).toLocaleString()}</div>}
                    {e.comments?.length>0&&<div style={{fontSize:11,color:'#525252',marginTop:1}}>💬{e.comments.length}</div>}
                  </div>
                </button>
              );
            })}
          </div>
        </div>
      ))}

      {deletedExp.length>0&&(
        <div>
          <button type="button" onClick={()=>setShowDel(v=>!v)} style={{background:'transparent',border:'none',color:'#525252',fontSize:13,cursor:'pointer',fontFamily:'inherit',padding:'4px 0',minHeight:36}}>
            {showDel?'▲':'▼'} 回收箱 ({deletedExp.length})
          </button>

// ════════ EXPENSE SHEET ════════
function ExpenseSheet({mode,expense,members,me,rates,onSave,onClose}){
  const isEdit=mode==='edit';
  const[name,setName]=useState(expense?.name||'');
  const[amount,setAmount]=useState(expense?.amount?.toString()||'');
  const[currency,setCurrency]=useState(expense?.currency||'JPY');
  const[cat,setCat]=useState(expense?.cat||'food');
  const[type,setType]=useState(expense?.type||'shared');
  const[paidBy,setPaidBy]=useState(expense?.paidBy||me?.id||members[0]?.id||'');
  const[sharedWith,setSharedWith]=useState(expense?.sharedWith||members.map(m=>m.id));
  const[splitMode,setSplitMode]=useState(expense?.splitMode||'equal');
  const[splits,setSplits]=useState(expense?.splits||{});
  const[location,setLocation]=useState(expense?.location||'');
  const[note,setNote]=useState(expense?.note||'');
  const[dt,setDt]=useState(expense?.dt?new Date(expense.dt).toISOString().slice(0,16):nowLocal());
  const[splitErr,setSplitErr]=useState('');

  useEffect(()=>{
    if(splitMode!=='manual')return setSplitErr('');
    const sw=sharedWith;
    const st=sw.reduce((s,id)=>s+Number(splits[id]||0),0);
    const amt=Number(amount||0);
    if(amt>0&&Math.abs(st-amt)>1)setSplitErr(`總和 ${Math.round(st)} ≠ ${Math.round(amt)}`);
    else setSplitErr('');
  },[splits,amount,splitMode,sharedWith]);

  const jpyPreview=useMemo(()=>{
    const amt=Number(amount||0);
    if(!amt||currency==='JPY'||!rates)return null;
    const jpy=toJpy(amt,currency,rates);
    return jpy?Math.round(jpy):null;
  },[amount,currency,rates]);

  return(
    <Sheet title={isEdit?'修改消費':'新增消費'} onClose={onClose}>
      <Field label="消費名稱"><input value={name} onChange={e=>setName(e.target.value)} placeholder="例：黑豚拉麵" autoFocus={!isEdit}/></Field>
      <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:12}}>
        <Field label="金額"><input type="number" inputMode="decimal" value={amount} onChange={e=>setAmount(e.target.value)} placeholder="0"/></Field>
        <Field label="貨幣">
          <select value={currency} onChange={e=>setCurrency(e.target.value)}>
            {CURS.map(c=><option key={c}>{c}</option>)}
          </select>
        </Field>
      </div>
      {jpyPreview&&<div style={{fontSize:12,color:'#737373',marginTop:-8}}>≈ ¥{jpyPreview.toLocaleString()}</div>}
      <Field label="類別">
        <div style={{display:'flex',gap:8,overflowX:'auto',paddingBottom:4,WebkitOverflowScrolling:'touch'}}>
          {CATS.map(c=>{
            const active=cat===c.id;
            return(
              <button key={c.id} type="button" onClick={()=>setCat(c.id)} style={{flexShrink:0,background:active?c.color+'33':'rgba(255,255,255,0.05)',border:`1.5px solid ${active?c.color:'rgba(255,255,255,0.1)'}`,borderRadius:10,padding:'7px 10px',fontSize:13,color:active?c.color:'#a3a3a3',cursor:'pointer',minHeight:36,fontFamily:'inherit'}}>
                {c.icon} {c.label}
              </button>
            );
          })}
        </div>
      </Field>
      <Field label="類型">
        <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:8}}>
          {[['shared','共同分帳'],['personal','個人消費']].map(([v,l])=>(
            <button key={v} type="button" onClick={()=>setType(v)} style={{background:type===v?'rgba(249,115,22,0.2)':'rgba(255,255,255,0.05)',border:`1.5px solid ${type===v?'#f97316':'rgba(255,255,255,0.1)'}`,borderRadius:12,padding:11,fontSize:14,color:type===v?'#f97316':'#a3a3a3',cursor:'pointer',minHeight:44,fontFamily:'inherit',fontWeight:type===v?600:400}}>
              {l}
            </button>
          ))}
        </div>
        {type==='personal'&&<div style={{fontSize:12,color:'#737373',marginTop:4}}>個人消費唔計入共同欠款</div>}
      </Field>
      <Field label="付款人">
        <select value={paidBy} onChange={e=>setPaidBy(e.target.value)}>
          {members.map(m=><option key={m.id} value={m.id}>{m.name}</option>)}
        </select>
      </Field>
      {type==='shared'&&(
        <>
          <Field label="分擔人">
            <div style={{display:'flex',gap:8,marginBottom:8}}>
              <button className="btn-s" style={{width:'auto',padding:'6px 12px',fontSize:12,minHeight:36}} type="button" onClick={()=>setSharedWith(members.map(m=>m.id))}>全部</button>
              <button className="btn-s" style={{width:'auto',padding:'6px 12px',fontSize:12,minHeight:36}} type="button" onClick={()=>setSharedWith(paidBy?[paidBy]:[])}>只付款人</button>
            </div>
            <div className="card2">
              {members.map((m,i)=>(
                <label key={m.id} style={{display:'flex',alignItems:'center',gap:10,padding:'10px 14px',borderBottom:i<members.length-1?'1px solid rgba(255,255,255,0.06)':'none',cursor:'pointer',minHeight:44}}>
                  <Avatar member={m} size={28}/>
                  <span style={{flex:1,fontSize:14,color:readable(m.color||COLORS[0])}}>{m.name}</span>
                  <input type="checkbox" checked={sharedWith.includes(m.id)} onChange={e=>setSharedWith(prev=>e.target.checked?[...new Set([...prev,m.id])]:prev.filter(x=>x!==m.id))}/>
                </label>
              ))}
            </div>
          </Field>
          <Field label="分帳方式">
            <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:8}}>
              {[['equal','平均分'],['manual','手動輸入']].map(([v,l])=>(
                <button key={v} type="button" onClick={()=>setSplitMode(v)} style={{background:splitMode===v?'rgba(249,115,22,0.2)':'rgba(255,255,255,0.05)',border:`1.5px solid ${splitMode===v?'#f97316':'rgba(255,255,255,0.1)'}`,borderRadius:12,padding:11,fontSize:14,color:splitMode===v?'#f97316':'#a3a3a3',cursor:'pointer',minHeight:44,fontFamily:'inherit',fontWeight:splitMode===v?600:400}}>
                  {l}
                </button>
              ))}
            </div>
          </Field>
          {splitMode==='manual'&&(
            <div>
              <div className="card2">
                {members.filter(m=>sharedWith.includes(m.id)).map((m,i,arr)=>(
                  <div key={m.id} style={{display:'flex',alignItems:'center',gap:10,padding:'10px 14px',borderBottom:i<arr.length-1?'1px solid rgba(255,255,255,0.06)':'none'}}>
                    <Avatar member={m} size={26}/>
                    <span style={{width:64,fontSize:13,color:readable(m.color||COLORS[0]),overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{m.name}</span>
                    <input type="number" inputMode="decimal" placeholder="0" value={splits[m.id]||''} onChange={e=>setSplits(p=>({...p,[m.id]:e.target.value}))} style={{flex:1,fontSize:14}}/>
                  </div>
                ))}
              </div>
              {splitErr&&<div style={{fontSize:12,color:'#f87171',marginTop:6}}>{splitErr}</div>}
            </div>
          )}
        </>
      )}
      <Field label="地點（可留空）"><input value={location} onChange={e=>setLocation(e.target.value)} placeholder="例：道頓堀"/></Field>
      <Field label="日期時間"><input type="datetime-local" value={dt} onChange={e=>setDt(e.target.value)}/></Field>
      <Field label="備註（可留空）"><textarea rows={3} value={note} onChange={e=>setNote(e.target.value)}/></Field>
      <button className="btn-p" disabled={!!splitErr} onClick={()=>onSave({name,amount,currency,cat,type,paidBy,sharedWith,splitMode,splits,location,note,dt})}>
        {isEdit?'儲存修改':'新增消費'}
      </button>
    </Sheet>
  );
}

          ['付款人',<span style={{color:readable(payer?.color||COLORS[0]),fontWeight:500}}>{payer?.name||'?'}</span>],
          ['分帳方式',expense.splitMode==='manual'?'手動':'平均'],
          ['分擔人',<div style={{display:'flex',flexWrap:'wrap',gap:4,justifyContent:'flex-end'}}>{sw.map(m=><span key={m.id} style={{color:readable(m.color||COLORS[0]),fontSize:13,background:'rgba(255,255,255,0.06)',borderRadius:6,padding:'2px 8px'}}>{m.name}</span>)}</div>],
        ].map(([l,v],i)=>(

            <span style={{fontSize:13,color:'#737373',flexShrink:0}}>{l}</span>
            <div style={{textAlign:'right',fontSize:14}}>{v}</div>

      {/* Comments */}
      <div>
        <div className="sec">留言</div>
        {!(expense.comments?.length)&&<div style={{fontSize:13,color:'#525252',marginBottom:8}}>未有留言</div>}

// ════════ MANUAL SETTLE SHEET ════════
function ManualSettleSheet({transfers,members,onSave,onClose}){
  const[label,setLabel]=useState('');
  const[amounts,setAmounts]=useState(Object.fromEntries(transfers.map(t=>[`${t.from}->${t.to}`,Math.round(t.amt).toString()])));
  return(
    <Sheet title="記錄當場結帳" onClose={onClose}>
      <Field label="備註（可留空）" hint="例如：酒店大堂結帳">
        <input value={label} onChange={e=>setLabel(e.target.value)} placeholder="今晚結帳"/>
      </Field>
      {transfers.length===0&&<div style={{fontSize:14,color:'#34d399',padding:'8px 0'}}>✓ 今晚暫時唔使轉帳，直接儲存快照即可</div>}
      {transfers.length>0&&(
        <div>
          <div style={{fontSize:13,color:'#a3a3a3',marginBottom:8}}>確認/修改轉帳金額（¥）</div>
          <div className="card2">
            {transfers.map((t,i)=>{
              const from=members.find(m=>m.id===t.from);
              const to=members.find(m=>m.id===t.to);
              const key=`${t.from}->${t.to}`;
              return(
                <div key={key} style={{display:'flex',alignItems:'center',gap:10,padding:'12px 14px',borderBottom:i<transfers.length-1?'1px solid rgba(255,255,255,0.06)':'none'}}>
                  <Avatar member={from} size={30}/>
                  <div style={{flex:1,fontSize:13}}>
                    <span style={{color:readable(from?.color||COLORS[0]),fontWeight:600}}>{from?.name}</span>
                    <span style={{color:'#525252'}}> 俾 </span>
                    <span style={{color:readable(to?.color||COLORS[0]),fontWeight:600}}>{to?.name}</span>
                  </div>
                  <div style={{display:'flex',alignItems:'center',gap:4}}>
                    <span style={{color:'#525252',fontSize:13}}>¥</span>
                    <input type="number" inputMode="numeric" value={amounts[key]||''} onChange={e=>setAmounts(p=>({...p,[key]:e.target.value}))} style={{width:90,fontSize:14,textAlign:'right'}}/>
                  </div>
                </div>
              );
            })}
          </div>
        </div>
      )}
      <button className="btn-p" onClick={()=>{
        const settlements=transfers.map(t=>{
          const key=`${t.from}->${t.to}`;
          return{from:t.from,to:t.to,amt:Number(amounts[key]||0)};
        }).filter(t=>t.amt>0);
        onSave({label:label||'今晚結帳',settlements});
      }}>儲存結帳快照</button>
      <div style={{fontSize:12,color:'#525252'}}>儲存後，「今晚結帳」將重置，總欠款會扣除呢次轉帳金額</div>
    </Sheet>
  );
}
