
<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>日本GOGOGO - 系統錯誤</title>
<style>
/* 核心排版：解決 Safari 高度跳動同防預設點擊反光 */
*{box-sizing:border-box;touch-action:manipulation;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;height:100dvh;width:100vw;overflow:hidden;background:#000;color:#f5f5f5;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased}

/* 🍎 真．Apple 獨立懸浮呼吸光球 (硬件加速，防 iOS Safari 罷工) */
.bg-orbs { position: fixed; inset: -20%; z-index: 0; overflow: hidden; background: #000; pointer-events: none; transition: opacity 0.4s ease; }
.orb { position: absolute; border-radius: 50%; filter: blur(55px); -webkit-filter: blur(55px); opacity: 0.75; will-change: transform; }
.orb-1 { width: 50vw; height: 50vw; background: #ff2d55; top: 10%; left: 10%; animation: float1 10s ease-in-out infinite alternate; }
.orb-2 { width: 60vw; height: 60vw; background: #5856d6; bottom: 10%; right: 10%; animation: float2 12s ease-in-out infinite alternate; }
.orb-3 { width: 55vw; height: 55vw; background: #ff9500; top: 40%; left: 20%; animation: float3 14s ease-in-out infinite alternate; }
.orb-4 { width: 45vw; height: 45vw; background: #007aff; top: 20%; right: 20%; animation: float4 16s ease-in-out infinite alternate; }

@keyframes float1 { 0% { transform: translate3d(0, 0, 0) scale(0.8); } 100% { transform: translate3d(25vw, 15vh, 0) scale(1.2); } }
@keyframes float2 { 0% { transform: translate3d(0, 0, 0) scale(0.8); } 100% { transform: translate3d(-30vw, -15vh, 0) scale(1.1); } }
@keyframes float3 { 0% { transform: translate3d(0, 0, 0) scale(0.8); } 100% { transform: translate3d(15vw, -20vh, 0) scale(1.3); } }
@keyframes float4 { 0% { transform: translate3d(0, 0, 0) scale(0.8); } 100% { transform: translate3d(-20vw, 25vh, 0) scale(1.1); } }

/* 全新滾動架構，支援 iOS 安全區域 */
.scroll-wrapper{position:absolute;inset:0;overflow:hidden;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom);display:flex;justify-content:center}

/* 🍏 iOS Safari 景深縮放特效 */
#app{
    height:100%;
    width:calc(100% - 32px);
    max-width: 600px;
    position:relative;
    z-index:10;
    overflow:hidden;
    transform-origin:top center;
    transition:transform 0.4s cubic-bezier(0.32,0.72,0,1), border-radius 0.4s ease, opacity 0.4s ease;
    background:transparent;
    will-change:transform, opacity;
}
body.sheet-open #app{transform:scale(0.92) translateY(12px);border-radius:24px;opacity:0.65;pointer-events:none}

/* 🪞 Apple Vision Pro 級終極玻璃透鏡 (雙重立體高光倒角) */
.glass-container {
    height: 100%;
    width: 100%;
    background:rgba(30, 30, 32, 0.45);
    -webkit-backdrop-filter:blur(40px) saturate(200%);
    backdrop-filter:blur(40px) saturate(200%);
    border-radius:20px;
    position:relative;
    box-shadow:0 8px 32px rgba(0,0,0,0.3);
    overflow:hidden;
    display: flex;
    flex-direction: column;
}
/* 🔥 靈魂所在：立體高光反射邊緣伪元素 */
.glass-container::before {
    content: ""; position: absolute; inset: 0; border-radius: inherit;
    border-top: 1.5px solid rgba(255, 255, 255, 0.35);
    border-left: 1px solid rgba(255, 255, 255, 0.15);
    border-right: 1px solid rgba(255, 255, 255, 0.05);
    border-bottom: 1px solid rgba(255, 255, 255, 0.02);
    pointer-events: none; z-index: 2;
}

/* 玻璃邊框內的頭部介面 */
.glass-head {
    padding: 16px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    border-bottom: 0.5px solid rgba(255,255,255,0.12);
    position: relative;
    z-index: 3;
}
.glass-title {
    font-size: 19px;
    font-weight: 800;
    color: #fff;
    letter-spacing: 0.02em;
}
.theme-btn{
    background:rgba(255,255,255,0.15);
    border:none;
    color:#fff;
    width:32px;
    height:32px;
    border-radius:50%;
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
    font-size:16px;
    transition:all 0.2s;
    backdrop-filter:blur(10px);
    -webkit-backdrop-filter:blur(10px);
}
.theme-btn:active{transform:scale(0.85);background:rgba(255,255,255,0.25)}

/* 404 Iframe 的終極包裹 */
.error-view {
    flex: 1;
    overflow: hidden;
    position: relative;
    z-index: 3;
}
.error-iframe {
    width: 100%;
    height: 100%;
    border: none;
    background: #f1f1f1; /* 這是 GitHub Pages 404 頁面的預設米白色背景 */
}

/* 🌙 純黑模式 (Pure Black Mode) 覆蓋樣式 - 一鍵護眼 */
body.pure-black .bg-orbs { opacity: 0; display: none; }
body.pure-black .glass-container { background: #1c1c1e; box-shadow: none; -webkit-backdrop-filter: none; backdrop-filter: none; border: 1px solid #2c2c2e; }
body.pure-black .glass-container::before { display: none; }
body.pure-black .glass-head { border-bottom: 0.5px solid #2c2c2e; }
body.pure-black .error-iframe { filter: invert(0.9) hue-rotate(180deg); } /* 強制將 Iframe 內的米色背景變黑 */

/* Toast 提示 */
.toast{position:fixed;top:calc(env(safe-area-inset-top)+20px);left:50%;transform:translate(-50%,-20px);background:rgba(28,28,30,0.85);-webkit-backdrop-filter:blur(24px);backdrop-filter:blur(24px);border:0.5px solid rgba(255,255,255,0.15);padding:16px 24px;border-radius:100px;font-size:15px;font-weight:600;z-index:100;opacity:0;pointer-events:none;transition:all 0.3s;box-shadow:0 12px 32px rgba(0,0,0,0.5);white-space:nowrap}
.toast.on{opacity:1;transform:translate(-50%,0)}
</style>
</head>
<body ontouchstart="">
<!-- 真．Apple Siri 獨立懸浮呼吸光球 -->
<div class="bg-orbs">
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>
    <div class="orb orb-3"></div>
    <div class="orb orb-4"></div>
</div>

<div class="scroll-wrapper">
    <div id="app">
        <!-- 🪞 3D 高光玻璃透鏡介面 -->
        <div class="glass-container">
            <div class="glass-head">
                <span class="glass-title">系統錯誤</span>
                <button onclick="toggleTheme()" class="theme-btn">🌙</button>
            </div>
            <div class="error-view">
                <!-- 將錯誤頁面的 URL (即來自 image_8.png 的來源) 包裹在 Iframe 內 -->
                <iframe src="https://some-github-repo-name.github.io/travel-expense-pro/" class="error-iframe" title="404 Error - File Not Found" frameborder="0"></iframe>
            </div>
        </div>
    </div>
</div>

<div id="toast" class="toast"></div>

<script>
// 核心邏輯
const APP = {tripId: 'travel-expense-pro'};
const $ = s => document.querySelector(s);
const key = 'tt_' + APP.tripId;

function loadState() {
    try { let s = JSON.parse(localStorage.getItem(key)); return s ? {pureBlack: false, ...s} : {pureBlack: false}; } 
    catch(e) { return {pureBlack: false}; }
}
function saveState(s) { localStorage.setItem(key, JSON.stringify(s)); }
let state = loadState();

function applyTheme() {
    if(state.pureBlack) document.body.classList.add('pure-black');
    else document.body.classList.remove('pure-black');
}

function toggleTheme() {
    state.pureBlack = !state.pureBlack;
    saveState(state);
    applyTheme();
    toast(state.pureBlack ? '🌙 純黑模式已開啟' : '✨ 玻璃透鏡已開啟');
}

function toast(t) { const e = $('#toast'); e.innerHTML = t; e.classList.add('on'); clearTimeout(toast._t); toast._t = setTimeout(() => e.classList.remove('on'), 2500); }

// 初始化啟動
function boot() {
    applyTheme();
    // 這裹不需要加載匯率，因為只顯示 404 介面
}

boot();
</script>
</body>
</html>
